<style>
.health-panel { margin-top: 20px; }
.health-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.health-mini-card { background: #f5f5f5; border: 1px solid #e8e8e8; border-radius: 6px; padding: 14px; transition: border-color 150ms ease; }
.health-mini-card:hover { border-color: #91d5ff; }
.health-mini-card .hmc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.health-mini-card .hmc-name { font-size: 13px; font-weight: 600; color: #333; }
.health-mini-card .hmc-type { font-size: 11px; color: #999; }
.health-mini-card .hmc-rings { display: flex; justify-content: space-around; gap: 8px; }
.health-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.health-ring { position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
.health-ring::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
.health-ring .ring-num { position: relative; z-index: 1; font-size: 11px; font-weight: 600; color: #333; font-family: monospace; }
.health-ring-wrap .ring-label { font-size: 11px; color: #999; }

.dc-card .dc-metrics { display: flex; gap: 12px; margin-bottom: 12px; padding: 8px 10px; background: #f5f5f5; border-radius: 4px; border: 1px solid #e8e8e8; }
.dc-card .dc-metrics .metric-item { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.dc-card .dc-metrics .metric-item .m-label { font-size: 11px; color: #999; }
.dc-card .dc-metrics .metric-item .m-value { font-size: 13px; font-weight: 600; color: #333; font-family: monospace; }
.dc-card .dc-metrics .metric-item .m-value.warn { color: #faad14; }

.trend-panel { margin-top: 20px; }
.trend-chart { display: flex; align-items: flex-end; gap: 18px; height: 200px; padding: 28px 8px 8px; }
.trend-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
.trend-bar { width: 100%; max-width: 52px; background: linear-gradient(180deg, #f59e0b, rgba(245,158,11,0.35)); border-radius: 4px 4px 0 0; position: relative; transition: opacity 150ms ease; min-height: 6px; cursor: pointer; }
.trend-bar:hover { opacity: 0.8; }
.trend-bar .bar-val { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #666; font-family: monospace; white-space: nowrap; }
.trend-label { font-size: 11px; color: #999; font-family: monospace; }
.trend-legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; }
.trend-legend .legend-dot { width: 10px; height: 10px; border-radius: 2px; background: #1890ff; }
.panel-subtitle { font-size: 12px; color: #999; font-weight: 400; margin-left: 8px; }

@media (max-width: 992px) { .health-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .health-grid { grid-template-columns: 1fr; } .trend-chart { gap: 8px; } }

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-radius: 6px; background: #fff; border: 1px solid #e8e8e8; box-shadow: 0 4px 16px rgba(0,0,0,0.15); min-width: 280px; max-width: 420px; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast .toast-icon { font-size: 18px; flex-shrink: 0; }
.toast .toast-content { flex: 1; font-size: 13px; }
.toast .toast-title { font-weight: 600; margin-bottom: 2px; color: #333; }
.toast .toast-message { color: #666; font-size: 12px; }
.toast-success { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.05); }
.toast-success .toast-title { color: #52c41a; }
.toast-warning { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
.toast-warning .toast-title { color: #faad14; }
.toast-error { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
.toast-error .toast-title { color: #f5222d; }
.toast-info { border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.05); }
.toast-info .toast-title { color: #1890ff; }

.confirm-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
.confirm-modal-overlay.show { display:flex; }
.confirm-modal-dialog { background:#fff; border:1px solid #e8e8e8; border-radius:4px; width:420px; overflow:hidden; }
.confirm-modal-header { padding:16px 20px; border-bottom:1px solid #e8e8e8; display:flex; align-items:center; gap:10px; }
.confirm-modal-icon { font-size:20px; }
.confirm-modal-title { font-size:15px; font-weight:600; color:#333; }
.confirm-modal-body { padding:20px; text-align:center; }
.confirm-modal-message { font-size:14px; color: #666; line-height:1.6; }
.confirm-modal-footer { display:flex; gap:12px; justify-content:flex-end; padding:16px 20px; border-top:1px solid #e8e8e8; }
</style>

<script>
var confirmCallback = null;

function showToast(message, type) {
  var container = document.getElementById('toastContainer');
  var icons = { success: '&#9989;', warning: '&#9888;', error: '&#10060;', info: '&#9432;' };
  var titles = { success: '操作成功', warning: '温馨提示', error: '系统提示', info: '系统提示' };
  var t = type || 'info';
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + t;
  toast.innerHTML = '<div class="toast-icon">' + icons[t] + '</div><div class="toast-content"><div class="toast-title">' + titles[t] + '</div><div class="toast-message">' + message + '</div></div>';
  container.appendChild(toast);
  setTimeout(function() { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(function() { toast.remove(); }, 300); }, 3000);
}

function showConfirm(message, type, callback) {
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('confirmTitle').textContent = (type === 'warning') ? '温馨提示' : '系统提示';
  document.getElementById('confirmIcon').innerHTML = (type === 'warning') ? '&#9888;' : '&#10060;';
  confirmCallback = callback;
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirmModal(result) {
  document.getElementById('confirmModal').classList.remove('show');
  if (confirmCallback) { confirmCallback(result); confirmCallback = null; }
}

const API_BASE = 'http://localhost:3001/api';

function getAccessToken() {
  return localStorage.getItem('accessToken');
}

function checkLogin() {
  var token = getAccessToken();
  if (!token) {
    localStorage.setItem('accessToken', 'offline_' + Date.now());
  }
  return true;
}

function getDbTypeLabel(type) {
  const types = {
    mysql: 'MySQL',
    postgres: 'PostgreSQL',
    mssql: 'SQL Server',
    sqlite: 'SQLite',
    oracle: 'Oracle',
    dm: '达梦',
    tidb: 'TiDB'
  };
  return types[type] || type;
}

function createDcCard(dc) {
  return '<div class="dc-card">' +
    '<div class="flex-between">' +
    '<div class="dc-status"><span class="status-dot ' + (dc.status === 1 ? 'online' : 'offline') + '"></span> ' + (dc.status === 1 ? '运行中' : '已停用') + '</div>' +
    '<span class="badge badge-' + (dc.status === 1 ? 'success' : 'warning') + '">' + (dc.status === 1 ? '正常' : '已停用') + '</span>' +
    '</div>' +
    '<div class="dc-name">' + dc.name + '</div>' +
    '<div class="dc-type">' + getDbTypeLabel(dc.dbType) + '</div>' +
    '<div class="dc-info">' +
    '<div><span class="label">主机:</span> ' + dc.dbHost + '</div>' +
    '<div><span class="label">端口:</span> ' + dc.dbPort + '</div>' +
    '<div><span class="label">数据库:</span> ' + dc.dbName + '</div>' +
    '<div><span class="label">编码:</span> ' + dc.code + '</div>' +
    '</div>' +
    '<div class="dc-metrics">' +
    '<div class="metric-item"><span class="m-label">最大连接数</span><span class="m-value">' + (dc.maxConnections || 20) + '</span></div>' +
    '<div class="metric-item"><span class="m-label">只读模式</span><span class="m-value">' + (dc.isReadonly ? '是' : '否') + '</span></div>' +
    '</div>' +
    '<div class="dc-actions">' +
    '<button class="btn btn-sm btn-ghost" onclick="testConnection(\'' + dc.id + '\')">&#9888; 测试连接</button>' +
    '<button class="btn btn-sm btn-ghost" onclick="editDataCenter(\'' + dc.id + '\')">&#9998; 编辑</button>' +
    '<button class="btn btn-sm btn-ghost" style="margin-left:auto;color: #f5222d;" onclick="deleteDataCenter(\'' + dc.id + '\', \'' + dc.name + '\')">&#128465; 删除</button>' +
    '</div>' +
    '</div>';
}

function loadDataCenters() {
  checkLogin();
  var dataCenters = JSON.parse(localStorage.getItem('erp_data_centers') || '[]');
  if (!dataCenters || dataCenters.length === 0) {
    dataCenters = [
      { id: 'dc-001', name: '测试数据中心', code: 'DC001', dbType: 'mysql', dbHost: 'localhost', dbPort: '3306', dbName: 'test_db', status: 1, maxConnections: 100 },
      { id: 'dc-002', name: '备用数据中心', code: 'DC002', dbType: 'mssql', dbHost: '127.0.0.1', dbPort: '1433', dbName: 'backup_db', status: 1, maxConnections: 50 }
    ];
    localStorage.setItem('erp_data_centers', JSON.stringify(dataCenters));
  }
  document.getElementById('statsContainer').innerHTML =
    '<div class="stat-card"><div class="stat-value">' + dataCenters.length + '</div><div class="stat-label">数据中心总数</div></div>' +
    '<div class="stat-card"><div class="stat-value text-success">' + dataCenters.filter(function(d) { return d.status === 1; }).length + '</div><div class="stat-label">正常运行</div></div>' +
    '<div class="stat-card"><div class="stat-value text-warning">' + dataCenters.filter(function(d) { return d.status !== 1; }).length + '</div><div class="stat-label">需要关注</div></div>' +
    '<div class="stat-card"><div class="stat-value text-mono">0<span style="font-size:14px;">GB</span></div><div class="stat-label">数据总量</div></div>';

  if (dataCenters.length > 0) {
    document.getElementById('dcCardsContainer').innerHTML = dataCenters.map(createDcCard).join('');
  } else {
    document.getElementById('dcCardsContainer').innerHTML =
      '<div class="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">' +
      '<div style="font-size: 48px; margin-bottom: 16px;">&#128451;</div>' +
      '<div style="color: #666; font-size: 14px;">暂无数据中心</div>' +
      '<a href="new.html" class="btn btn-primary" style="margin-top: 20px;">+ 新建数据中心</a>' +
      '</div>';
  }
}

function testConnection(id) {
  checkLogin();
  showToast('测试连接功能需要后端服务支持', 'info');
}

function editDataCenter(id) {
  window.location.href = 'new.html?id=' + id;
}

function deleteDataCenter(id, name) {
  showConfirm('确定要删除数据中心 "' + name + '" 吗？', 'warning', function(result) {
    if (!result) return;
    var dataCenters = JSON.parse(localStorage.getItem('erp_data_centers') || '[]');
    dataCenters = dataCenters.filter(function(d) { return d.id !== id; });
    localStorage.setItem('erp_data_centers', JSON.stringify(dataCenters));
    showToast('删除成功', 'success');
    loadDataCenters();
  });
}

window.addEventListener('DOMContentLoaded', function() {
  checkLogin();
  loadDataCenters();
});
</script>
