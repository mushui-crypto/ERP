<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>汇率管理 - 基础资料</title>
<link rel="stylesheet" href="../common.css">
<style>
.page-header { margin-bottom: 16px; }
.main-content { margin-left: 220px; padding: 20px; }
.list-action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.action-btn { padding: 8px 16px; border: 1px solid #d9d9d9; border-radius: 4px; cursor: pointer; font-size: 13px; }
.action-btn:hover { background: #f5f5f5; }
.action-btn.primary-action { background: #1890ff; color: #fff; border-color: #1890ff; }
.action-btn.danger-action { background: #f5222d; color: #fff; border-color: #f5222d; }
.action-separator { width: 1px; background: #e8e8e8; margin: 0 8px; }
.search-area { background: #fff; padding: 16px; border-radius: 6px; margin-bottom: 16px; }
.search-row { display: flex; gap: 16px; flex-wrap: wrap; }
.search-item { display: flex; align-items: center; gap: 8px; }
.search-item input, .search-item select { padding: 6px 10px; border: 1px solid #e8e8e8; border-radius: 4px; }
.search-btn { padding: 6px 16px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.table-wrapper { background: #fff; border-radius: 6px; overflow: hidden; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e8e8e8; }
.data-table th { background: #fafafa; font-weight: 600; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.badge-success { background: #f6ffed; color: #52c41a; }
.badge-warning { background: #fffbe6; color: #faad14; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal-dialog { background:#fff; border-radius:6px; width:480px; padding:20px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-title { font-size:16px; font-weight:600; }
.modal-close { font-size:20px; cursor:pointer; color:#666; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; margin-bottom:4px; font-size:13px; color:#666; }
.form-input, .form-select { width:100%; padding:8px 12px; border:1px solid #e8e8e8; border-radius:4px; }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.btn { padding:6px 16px; border-radius:4px; cursor:pointer; font-size:13px; }
.btn-primary { background:#1890ff; color:#fff; border:none; }
.btn-default { background:#fff; color:#666; border:1px solid #d9d9d9; }
.toast { position:fixed; top:20px; right:20px; padding:12px 20px; border-radius:4px; color:#fff; font-size:13px; z-index:9999; }
.toast-success { background:#52c41a; }
.toast-warning { background:#faad14; }
.toast-info { background:#1890ff; }
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="../images/logo.png" alt="磐枢工业智能平台" style="width: 100%; max-width: 200px;">
    <h1>磐枢HubPang</h1>
  </div>
  <nav class="sidebar-menu"></nav>
</aside>
<div class="main-content">
  <div class="page-header" style="position:sticky;top:0;z-index:100;">
    <h2>汇率管理</h2>
    <div class="breadcrumb"><a href="../index.html">首页</a> / 基础资料</div></div>
  </div>
  <div class="list-action-bar">
    <button class="action-btn primary-action" onclick="openAddModal()">+ 新增</button>
    <button class="action-btn" onclick="editSelected()">编辑</button>
    <button class="action-btn danger-action" onclick="deleteSelected()">删除</button>
    <button class="action-btn" onclick="auditSelected()">审核</button>
    <button class="action-btn" onclick="unAuditSelected()">反审核</button>
    <div class="action-separator"></div>
    <button class="action-btn" onclick="searchData()">查询</button>
    <button class="action-btn" onclick="refreshData()">刷新</button>
    <button class="action-btn" onclick="exportData()">导出</button>
    <button class="action-btn" onclick="importData()">导入</button>
    <button class="action-btn" onclick="exitPage()">退出</button>
  </div>
  <div class="search-area">
    <div class="search-row">
      <div class="search-item"><label>编码</label><input type="text" id="filterCode"></div>
      <div class="search-item"><label>名称</label><input type="text" id="filterName"></div>
      <div class="search-item"><label>状态</label><select id="filterStatus"><option value="">全部</option><option value="active">已启用</option><option value="inactive">未启用</option><option value="pending">待审核</option><option value="approved">已审核</option></select></div>
      <button class="search-btn" onclick="searchData()">查询</button>
    </div>
  </div>
  <div class="table-wrapper">
    <table class="data-table">
      <thead><tr><th><input type="checkbox" onclick="selectAll()"></th><th>编码</th><th>名称</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="dataBody"></tbody>
    </table>
  </div>
</div>
<div class="modal-overlay" id="addModal">
  <div class="modal-dialog">
    <div class="modal-header"><div class="modal-title" id="modalTitle">新增汇率管理</div><span class="modal-close" onclick="closeAddModal()">×</span></div>
    <div class="form-group"><label>编码</label><input type="text" id="formCode" class="form-input"></div>
    <div class="form-group"><label>名称</label><input type="text" id="formName" class="form-input"></div>
    <div class="form-group"><label>状态</label><select id="formStatus" class="form-select"><option value="active">已启用</option><option value="inactive">未启用</option></select></div>
    <div class="modal-footer"><button class="btn btn-default" onclick="closeAddModal()">取消</button><button class="btn btn-primary" onclick="saveData()">保存</button></div>
  </div>
</div>
<script>
var docType = 'base_exchange_rate';
var editingId = null;

function init() { loadData(); }
function loadData() {
  var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
  if (list.length === 0) {
    var now = new Date().toISOString();
    list = [{ id: '1', code: 'BAS-001', name: '测试汇率管理1', status: 'active', createdAt: now },
            { id: '2', code: 'BAS-002', name: '测试汇率管理2', status: 'pending', createdAt: now },
            { id: '3', code: 'BAS-003', name: '测试汇率管理3', status: 'approved', createdAt: now }];
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
  }
  renderTable(list);
}
function renderTable(list) {
  var tbody = document.getElementById('dataBody');
  tbody.innerHTML = '';
  if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">暂无数据</td></tr>'; return; }
  var statusMap = { 'active': '已启用', 'inactive': '未启用', 'pending': '待审核', 'approved': '已审核' };
  var statusClassMap = { 'active': 'badge-success', 'inactive': 'badge-warning', 'pending': 'badge-warning', 'approved': 'badge-success' };
  list.forEach(function(item) {
    var row = document.createElement('tr');
    row.innerHTML = '<td><input type="checkbox" class="data-checkbox" value="' + item.id + '"></td>' +
                    '<td>' + item.code + '</td><td>' + item.name + '</td>' +
                    '<td><span class="badge ' + statusClassMap[item.status] + '">' + statusMap[item.status] + '</span></td>' +
                    '<td>' + (item.createdAt ? new Date(item.createdAt).toLocaleString() : '') + '</td>' +
                    '<td><button onclick="editDetail(\' + item.id + )">编辑</button> <button onclick="deleteDetail(\' + item.id + )">删除</button></td>';
    tbody.appendChild(row);
  });
}
function searchData() {
  var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
  var filtered = list.filter(function(item) {
    if (document.getElementById('filterCode').value && !item.code.includes(document.getElementById('filterCode').value)) return false;
    if (document.getElementById('filterName').value && !item.name.includes(document.getElementById('filterName').value)) return false;
    if (document.getElementById('filterStatus').value && item.status !== document.getElementById('filterStatus').value) return false;
    return true;
  });
  renderTable(filtered);
}
function refreshData() { loadData(); }
function selectAll() {
  var master = document.querySelector('.data-table th input');
  document.querySelectorAll('.data-checkbox').forEach(function(cb) { cb.checked = master.checked; });
}
function getSelectedIds() {
  return Array.from(document.querySelectorAll('.data-checkbox:checked')).map(function(cb) { return cb.value; });
}
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').innerText = '新增汇率管理';
  document.getElementById('formCode').value = '';
  document.getElementById('formName').value = '';
  document.getElementById('formStatus').value = 'active';
  document.getElementById('addModal').classList.add('show');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
function saveData() {
  var code = document.getElementById('formCode').value;
  var name = document.getElementById('formName').value;
  if (!code) { showToast('请输入编码', 'warning'); return; }
  if (!name) { showToast('请输入名称', 'warning'); return; }
  var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
  if (editingId) {
    list.forEach(function(item) { if (item.id === editingId) { item.code = code; item.name = name; item.status = document.getElementById('formStatus').value; } });
    showToast('编辑成功', 'success');
  } else {
    list.push({ id: Date.now().toString(), code: code, name: name, status: document.getElementById('formStatus').value, createdAt: new Date().toISOString() });
    showToast('新增成功', 'success');
  }
  localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
  closeAddModal();
  loadData();
}
function editDetail(id) {
  var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
  var item = list.find(function(i) { return i.id === id; });
  if (item) {
    editingId = id;
    document.getElementById('modalTitle').innerText = '编辑汇率管理';
    document.getElementById('formCode').value = item.code;
    document.getElementById('formName').value = item.name;
    document.getElementById('formStatus').value = item.status;
    document.getElementById('addModal').classList.add('show');
  }
}
function deleteDetail(id) { showConfirm("确认删除？", function(result) { if(result) {
    var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
    list = list.filter(function(item) { return item.id !== id; } });
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
    showToast('删除成功', 'success');
    loadData();
  }
}
function editSelected() {
  var ids = getSelectedIds();
  if (ids.length !== 1) { showToast('请选择一条记录', 'warning'); return; }
  editDetail(ids[0]);
}
function deleteSelected() {
  var ids = getSelectedIds();
  if (ids.length === 0) { showToast('请选择要删除的记录', 'warning'); return; }
  showConfirm('确认删除选中的 ' + ids.length + ' 条记录？', function() {
    var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
    list = list.filter(function(item) { return !ids.includes(item.id); });
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
    showToast('已删除 ' + ids.length + ' 条记录', 'success');
    loadData();
  }
}
function auditSelected() {
  var ids = getSelectedIds();
  if (ids.length === 0) { showToast('请选择要审核的记录', 'warning'); return; }
  showConfirm('确认审核选中的 ' + ids.length + ' 条记录？', function() {
    var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
    var count = 0;
    list.forEach(function(item) { if (ids.includes(item.id) && item.status === 'pending') { item.status = 'approved'; count++; }); });
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
    showToast('已审核 ' + count + ' 条记录', 'success');
    loadData();
  }
}
function unAuditSelected() {
  var ids = getSelectedIds();
  if (ids.length === 0) { showToast('请选择要反审核的记录', 'warning'); return; }
  showConfirm('确认反审核选中的 ' + ids.length + ' 条记录？', function() {
    var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
    var count = 0;
    list.forEach(function(item) { if (ids.includes(item.id) && item.status === 'approved') { item.status = 'pending'; count++; }); });
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
    showToast('已反审核 ' + count + ' 条记录', 'success');
    loadData();
  }
}
function exportData() {
  var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
  var csv = '编码,名称,状态,创建时间\n';
  list.forEach(function(item) { csv += item.code + ',' + item.name + ',' + item.status + ',' + item.createdAt + '\n'; });
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = '汇率管理.csv';
  link.click();
  showToast('导出成功', 'success');
}
function importData() { showToast('导入功能开发中', 'info'); }
function exitPage() { showConfirm("确认退出？", function() { window.location.href = "../index.html"; }); } }); }
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
