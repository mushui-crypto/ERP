<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务退货 - 新增/编辑</title>
<link rel="stylesheet" href="../common.css">
<script src="../common.js"></script>
<script></script>
<style>
.doc-page{display:flex;height:100vh;background:#f0f2f5;}
.doc-sidebar{width:200px;background:#001529;color:#fff;display:flex;flex-direction:column;}
.doc-sidebar-title{padding:16px 20px;font-size:15px;font-weight:600;border-bottom:1px solid #002140;background:#001529;}
.doc-sidebar-menu{list-style:none;padding:0;margin:0;flex:1;}
.doc-sidebar-menu li a{display:flex;align-items:center;padding:12px 20px;color:#bfbfbf;text-decoration:none;font-size:13px;transition:all 0.3s;}
.doc-sidebar-menu li a:hover{background:#002140;color:#fff;}
.doc-sidebar-menu li a.active{background:#1890ff;color:#fff;}
.doc-content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.doc-header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e8e8e8;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.doc-header-title{font-size:20px;font-weight:600;color:#333;margin-bottom:4px;}
.doc-header-subtitle{font-size:13px;color:#999;}
.doc-toolbar{display:flex;gap:8px;flex-wrap:wrap;}
.toolbar-btn{padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#666;display:flex;align-items:center;gap:6px;transition:all 0.3s;}
.toolbar-btn:hover{border-color:#1890ff;color:#1890ff;}
.toolbar-btn.primary{background:#1890ff;color:#fff;border-color:#1890ff;}
.toolbar-btn.danger{background:#f5222d;color:#fff;border-color:#f5222d;}
.doc-body{flex:1;padding:16px;overflow-y:auto;}
.doc-card{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,0.05);overflow:hidden;margin-bottom:16px;}
.doc-card-title{padding:14px 20px;border-bottom:1px solid #e8e8e8;font-weight:600;font-size:14px;color:#333;background:#fafafa;}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 16px;padding:20px;}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;padding:20px;}
.form-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;padding:20px;}
.form-item{display:flex;flex-direction:column;}
.form-item label{font-size:13px;color:#666;margin-bottom:4px;font-weight:500;}
.form-item label .required{color:#f5222d;margin-right:4px;}
.form-item input,.form-item select,.form-item textarea{padding:6px 10px;border:1px solid #e8e8e8;border-radius:4px;font-size:13px;color:#333;background:#fff;box-sizing:border-box;}
.form-item input:focus,.form-item select:focus,.form-item textarea:focus{outline:none;border-color:#1890ff;}
.form-item textarea{resize:vertical;min-height:100px;}
.form-item .readonly{background:#fafafa;color:#999;}
.lookup-field{display:flex;align-items:center;}
.lookup-field input{flex:1;border-radius:4px 0 0 4px;}
.lookup-field button{width:28px;height:28px;border:1px solid #e8e8e8;border-left:none;border-radius:0 4px 4px 0;background:#fff;cursor:pointer;}
.lookup-field button:hover{background:#f5f5f5;}
.lookup-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;}
.lookup-modal.show{display:flex;}
.lookup-dialog{background:#fff;border:1px solid #d9d9d9;border-radius:8px;width:800px;height:500px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.15);position:relative;resize:both;}
.lookup-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;background:#fafafa;display:flex;align-items:center;justify-content:space-between;cursor:move;}
.lookup-title{font-size:16px;font-weight:600;color:#333;}
.lookup-close{font-size:20px;color:#999;cursor:pointer;border:none;background:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;}
.lookup-close:hover{background:#f5f5f5;color:#666;}
.lookup-search{display:flex;gap:8px;margin-bottom:12px;}
.lookup-search input{flex:1;padding:8px 12px;border:1px solid #e8e8e8;border-radius:4px;font-size:13px;}
.lookup-search button{padding:8px 16px;border:none;background:#1890ff;color:#fff;border-radius:4px;cursor:pointer;font-size:13px;}
.lookup-table{width:100%;border-collapse:collapse;}
.lookup-table th,.lookup-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #e8e8e8;}
.lookup-table th{background:#fafafa;font-weight:600;color:#333;}
.lookup-table tr:hover{background:#f5f5f5;}
.lookup-table .checkbox-cell{width:40px;}
.toast{position:fixed;top:60px;right:20px;padding:12px 20px;border-radius:4px;color:#fff;font-size:13px;z-index:9999;animation:toastIn 0.3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(100%);}to{opacity:1;transform:translateX(0);}}
.toast-success{background:rgba(34,197,94,0.9);}
.toast-warning{background:rgba(245,158,11,0.9);}
.toast-error{background:rgba(239,68,68,0.9);}
</style>
</head>
<body>
<div class="doc-page">
  <aside class="doc-sidebar">
    <div class="doc-sidebar-title">业务导航</div>
    <ul class="doc-sidebar-menu">
      <li><a href="service-request.html"><span class="menu-icon">&#128203;</span> 服务请求列表</a></li>
      <li><a href="service-dispatch.html"><span class="menu-icon">&#128246;</span> 服务派工</a></li>
      <li><a href="service-record.html"><span class="menu-icon">&#128190;</span> 服务记录列表</a></li>
      <li><a href="service-return.html"><span class="menu-icon">&#128205;</span> 服务退货列表</a></li>
      <li><a href="#" class="active"><span class="menu-icon">&#10010;</span> 服务退货新增</a></li>
    </ul>
  </aside>
  <div class="doc-content">
    <header class="doc-header">
      <div>
        <div class="doc-header-title" id="pageTitle">服务退货 - 新增</div>
        <div class="doc-header-subtitle">新建服务退货单</div>
      </div>
      <div class="doc-toolbar">
        <button class="toolbar-btn" onclick="goToList()"><span class="icon">📋</span> 列表</button>
        <button class="toolbar-btn" onclick="selectRecord()"><span class="icon">🔍</span> 选单</button>
        <button class="toolbar-btn primary" onclick="saveDoc()"><span class="icon">✓</span> 保存</button>
        <button class="toolbar-btn" onclick="submitDoc()"><span class="icon">✓</span> 提交</button>
        <div style="width:1px;height:24px;background:#e8e8e8;margin:0 8px;"></div>
        <button class="toolbar-btn danger" onclick="exitDoc()"><span class="icon">✖️</span> 退出</button>
      </div>
    </header>
    <div class="doc-body">
      <div class="doc-card">
        <div class="doc-card-title">基本信息</div>
        <div class="form-grid">
          <div class="form-item"><label>单据编号</label><input type="text" id="field_单据编号" readonly class="readonly"></div>
          <div class="form-item"><label><span class="required">*</span>日期</label><input type="date" id="field_日期"></div>
          <div class="form-item"><label>来源单据</label><input type="text" id="field_来源单据" readonly class="readonly"></div>
          <div class="form-item"><label>状态</label><input type="text" id="field_状态" readonly class="readonly" value="草稿"></div>
        </div>
      </div>
      <div class="doc-card">
        <div class="doc-card-title">客户信息</div>
        <div class="form-grid">
          <div class="form-item"><label>客户</label><input type="text" id="field_客户" readonly class="readonly"></div>
          <div class="form-item"><label>服务类型</label><input type="text" id="field_服务类型" readonly class="readonly"></div>
          <div class="form-item"><label>联系电话</label><input type="text" id="field_联系电话" placeholder="请输入联系电话"></div>
          <div class="form-item"><label>退货联系人</label><input type="text" id="field_退货联系人" placeholder="请输入退货联系人"></div>
        </div>
      </div>
      <div class="doc-card">
        <div class="doc-card-title">退货信息</div>
        <div class="form-grid-2">
          <div class="form-item"><label><span class="required">*</span>退货原因</label><textarea id="field_退货原因" placeholder="请详细描述退货原因..."></textarea></div>
          <div class="form-item"><label>备注</label><textarea id="field_备注" placeholder="请输入备注信息..."></textarea></div>
        </div>
      </div>
      <div class="doc-card">
        <div class="doc-card-title">退货明细</div>
        <div style="padding:20px;">
          <table class="lookup-table">
            <thead><tr><th>序号</th><th>物料名称</th><th>规格型号</th><th>单位</th><th>数量</th><th>单价</th><th>金额</th></tr></thead>
            <tbody id="returnDetailBody">
              <tr><td colspan="7" style="text-align:center;color:#999;">暂无明细数据</td></tr>
            </tbody>
          </table>
          <button class="btn btn-primary" style="margin-top:12px;" onclick="addDetailRow()">+ 添加明细</button>
        </div>
      </div>
      <div class="doc-card">
        <div class="doc-card-title">费用信息</div>
        <div class="form-grid">
          <div class="form-item"><label>退货金额</label><input type="number" id="field_退货金额" placeholder="请输入退货金额"></div>
          <div class="form-item"><label>运费</label><input type="number" id="field_运费" placeholder="请输入运费"></div>
          <div class="form-item"><label>其他费用</label><input type="number" id="field_其他费用" placeholder="请输入其他费用"></div>
          <div class="form-item"><label>总金额</label><input type="number" id="field_总金额" readonly class="readonly"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="lookup-modal" id="lookupModal">
  <div class="lookup-dialog">
    <div class="lookup-header"><span class="lookup-title" id="lookupTitle">选择</span><button class="lookup-close" onclick="closeLookup()">×</button></div>
    <div class="lookup-body">
      <div class="lookup-search"><input type="text" id="lookupKeyword" placeholder="搜索..." onkeyup="filterLookup()"><button onclick="filterLookup()">搜索</button></div>
      <table class="lookup-table"><thead id="lookupTableHead"></thead><tbody id="lookupTableBody"></tbody></table>
    </div>
    <div class="lookup-footer" style="padding:12px 20px;border-top:1px solid #e8e8e8;display:flex;justify-content:flex-end;gap:8px;">
      <button class="toolbar-btn" onclick="closeLookup()">取消</button>
      <button class="toolbar-btn primary" onclick="confirmLookup()">确定</button>
    </div>
  </div>
</div>

<script>
var currentLookupField = null;
var currentLookupType = null;
var lookupData = [];
var lookupColumns = [];
var currentDocId = null;

function init() {
  document.getElementById('field_日期').value = new Date().toISOString().split('T')[0];
  document.getElementById('field_单据编号').value = 'SRR' + new Date().toISOString().replace(/[-T:]/g, '').substring(2, 14);
}

function openLookup(fieldId, type) {
  currentLookupField = fieldId;
  currentLookupType = type;
  if (type === 'customer') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_customers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择客户';
  }
  renderLookupTable(lookupData);
  document.getElementById('lookupModal').classList.add('show');
}

function closeLookup() { document.getElementById('lookupModal').classList.remove('show'); }

function filterLookup() {
  var keyword = document.getElementById('lookupKeyword').value.trim().toLowerCase();
  var filtered = lookupData.filter(function(item) {
    return (item.code || '').toLowerCase().includes(keyword) || (item.name || '').toLowerCase().includes(keyword);
  });
  renderLookupTable(filtered);
}

function renderLookupTable(data) {
  var head = document.getElementById('lookupTableHead');
  var body = document.getElementById('lookupTableBody');
  head.innerHTML = '<tr><th class="checkbox-cell"><input type="checkbox" onclick="selectAllLookup()"></th>' + lookupColumns.map(function(col) { return '<th>' + col + '</th>'; }).join('') + '</tr>';
  body.innerHTML = '';
  data.forEach(function(item) {
    var row = document.createElement('tr');
    row.onclick = function() { selectLookupRow(this); };
    var cells = ['<td class="checkbox-cell"><input type="checkbox" class="lookup-checkbox" value="' + item.id + '"></td>'];
    if (currentLookupType === 'customer') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    }
    row.innerHTML = cells.join('');
    body.appendChild(row);
  });
}

function selectAllLookup() {
  var master = document.querySelector('.lookup-table th input');
  document.querySelectorAll('.lookup-checkbox').forEach(function(cb) { cb.checked = master.checked; });
}

function selectLookupRow(row) { row.querySelector('.lookup-checkbox').checked = !row.querySelector('.lookup-checkbox').checked; }

function confirmLookup() {
  var checkboxes = document.querySelectorAll('.lookup-checkbox:checked');
  if (checkboxes.length === 0) { showToast('请选择一条记录', 'warning'); return; }
  var item = lookupData.find(function(d) { return d.id === checkboxes[0].value; });
  if (item) {
    var field = document.getElementById('field_' + currentLookupField);
    if (field) { field.value = item.name; }
  }
  closeLookup();
}

function selectRecord() {
  currentLookupType = 'record';
  lookupColumns = ['单据编号', '日期', '客户', '服务人员', '服务结果'];
  lookupData = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.startsWith('service_record_')) {
      try {
        var item = JSON.parse(localStorage.getItem(key));
        lookupData.push(item);
      } catch(e) {}
    }
  }
  lookupData.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  document.getElementById('lookupTitle').textContent = '选择服务记录';
  renderLookupTable(lookupData);
  document.getElementById('lookupModal').classList.add('show');
}

function confirmLookup() {
  var checkboxes = document.querySelectorAll('.lookup-checkbox:checked');
  if (checkboxes.length === 0) { showToast('请选择一条记录', 'warning'); return; }
  var item = lookupData.find(function(d) { return d.id === checkboxes[0].value; });
  if (item) {
    if (currentLookupType === 'record') {
      document.getElementById('field_来源单据').value = item.docNo;
      document.getElementById('field_客户').value = item.customer;
      document.getElementById('field_服务类型').value = item.serviceType;
    } else {
      var field = document.getElementById('field_' + currentLookupField);
      if (field) { field.value = item.name; }
    }
  }
  closeLookup();
}

function renderLookupTable(data) {
  var head = document.getElementById('lookupTableHead');
  var body = document.getElementById('lookupTableBody');
  head.innerHTML = '<tr><th class="checkbox-cell"><input type="checkbox" onclick="selectAllLookup()"></th>' + lookupColumns.map(function(col) { return '<th>' + col + '</th>'; }).join('') + '</tr>';
  body.innerHTML = '';
  data.forEach(function(item) {
    var row = document.createElement('tr');
    row.onclick = function() { selectLookupRow(this); };
    var cells = ['<td class="checkbox-cell"><input type="checkbox" class="lookup-checkbox" value="' + item.id + '"></td>'];
    if (currentLookupType === 'customer') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'record') {
      var resultText = item.result === 'success' ? '服务成功' : item.result === 'partial' ? '部分完成' : item.result === 'failed' ? '服务失败' : item.result;
      cells.push('<td>' + item.docNo + '</td><td>' + item.date + '</td><td>' + item.customer + '</td><td>' + item.servicePerson + '</td><td>' + resultText + '</td>');
    }
    row.innerHTML = cells.join('');
    body.appendChild(row);
  });
}

function addDetailRow() {
  var tbody = document.getElementById('returnDetailBody');
  if (tbody.querySelector('td[colspan]')) tbody.innerHTML = '';
  var index = tbody.children.length + 1;
  var row = document.createElement('tr');
  row.innerHTML = '<td>' + index + '</td>' +
    '<td><input type="text" placeholder="物料名称"></td>' +
    '<td><input type="text" placeholder="规格型号"></td>' +
    '<td><input type="text" placeholder="单位"></td>' +
    '<td><input type="number" placeholder="数量"></td>' +
    '<td><input type="number" placeholder="单价"></td>' +
    '<td><input type="number" placeholder="金额" readonly></td>';
  tbody.appendChild(row);
}

function calculateTotal() {
  var returnAmount = parseFloat(document.getElementById('field_退货金额').value) || 0;
  var freight = parseFloat(document.getElementById('field_运费').value) || 0;
  var other = parseFloat(document.getElementById('field_其他费用').value) || 0;
  document.getElementById('field_总金额').value = (returnAmount + freight + other).toFixed(2);
}

function goToList() { location.href = 'service-return.html'; }

function validateForm() {
  if (!document.getElementById('field_日期').value.trim()) { showToast('日期为必填项！', 'warning'); return false; }
  if (!document.getElementById('field_退货原因').value.trim()) { showToast('退货原因为必填项！', 'warning'); return false; }
  return true;
}

function saveDoc() {
  if (!validateForm()) return;
  calculateTotal();
  
  var doc = {
    id: currentDocId || 'SRR' + Date.now(),
    docNo: document.getElementById('field_单据编号').value,
    date: document.getElementById('field_日期').value,
    sourceDoc: document.getElementById('field_来源单据').value,
    customer: document.getElementById('field_客户').value,
    serviceType: document.getElementById('field_服务类型').value,
    phone: document.getElementById('field_联系电话').value,
    returnContact: document.getElementById('field_退货联系人').value,
    returnReason: document.getElementById('field_退货原因').value,
    returnAmount: parseFloat(document.getElementById('field_退货金额').value) || 0,
    freight: parseFloat(document.getElementById('field_运费').value) || 0,
    otherCost: parseFloat(document.getElementById('field_其他费用').value) || 0,
    totalAmount: parseFloat(document.getElementById('field_总金额').value) || 0,
    status: 'draft',
    remark: document.getElementById('field_备注').value,
    createdAt: new Date().toISOString()
  };
  localStorage.setItem('service_return_' + doc.id, JSON.stringify(doc));
  showToast('保存成功！', 'success');
  currentDocId = doc.id;
}

function submitDoc() {
  if (!validateForm()) return;
  if (!currentDocId) { saveDoc(); }
  var doc = JSON.parse(localStorage.getItem('service_return_' + currentDocId));
  doc.status = 'pending';
  localStorage.setItem('service_return_' + currentDocId, JSON.stringify(doc));
  document.getElementById('field_状态').value = '待审核';
  showToast('提交成功，等待审核！', 'success');
}

function exitDoc() {
  showConfirm("确认退出？未保存的数据将丢失。", function(result) { if(result) {
    location.href = 'service-return.html';
  } });
}

, 3000);
}

init();
</script>
</body>
</html>
