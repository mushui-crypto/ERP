<script src="../doc-data-store.js">
var currentLookupField = null;
var currentLookupType = null;
var lookupData = [];
var lookupColumns = [];

function openLookup(fieldId, type) {
  currentLookupField = fieldId;
  currentLookupType = type;
  
  if (type === 'org') {
    lookupColumns = ['编码', '名称', '形态', '上级组织'];
    lookupData = JSON.parse(localStorage.getItem('erp_orgs') || '[]');
    document.getElementById('lookupTitle').textContent = '选择组织';
  } else if (type === 'department') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_departments_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择部门';
  } else if (type === 'employee') {
    lookupColumns = ['编号', '姓名', '所属部门'];
    lookupData = JSON.parse(localStorage.getItem('erp_employees_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择员工';
  } else if (type === 'supplier') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_suppliers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择供应商';
  } else if (type === 'customer') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_customers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择客户';
  } else if (type === 'material') {
    lookupColumns = ['物料编码', '物料名称', '规格型号', '基本单位'];
    lookupData = JSON.parse(localStorage.getItem('erp_materials_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择物料';
  } else if (type === 'warehouse') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_warehouses_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择仓库';
  }
  
  renderLookupTable(lookupData);
  document.getElementById('lookupModal').classList.add('show');
}

function closeLookup() {
  document.getElementById('lookupModal').classList.remove('show');
}

function filterLookup() {
  var keyword = document.getElementById('lookupKeyword').value.trim().toLowerCase();
  var filtered = lookupData.filter(function(item) {
    var code = item.code || '';
    var name = item.name || '';
    return code.toLowerCase().includes(keyword) || name.toLowerCase().includes(keyword);
  });
  renderLookupTable(filtered);
}

function renderLookupTable(data) {
  var head = document.getElementById('lookupTableHead');
  var body = document.getElementById('lookupTableBody');
  
  head.innerHTML = '<tr><th class="checkbox-cell"><input type="checkbox" onclick="selectAllLookup()"></th>' + lookupColumns.map(function(col) { return '<th>' + col + '</th>'; }).join('') + '</tr>';
  
  body.innerHTML = '';
  data.forEach(function(item) {
    var row = document.createElement('tr');
    row.onclick = function() { selectLookupRow(this); };
    var cells = ['<td class="checkbox-cell"><input type="checkbox" class="lookup-checkbox" value="' + item.id + '"></td>'];
    if (currentLookupType === 'org') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.form || '') + '</td><td>' + (item.parentName || '') + '</td>');
    } else if (currentLookupType === 'department') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'employee') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.department || '') + '</td>');
    } else if (currentLookupType === 'supplier' || currentLookupType === 'customer') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'material') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.specification || '') + '</td><td>' + (item.unit || '') + '</td>');
    } else if (currentLookupType === 'warehouse') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    }
    row.innerHTML = cells.join('');
    body.appendChild(row);
  });
  
  if (data.length === 0) {
    body.innerHTML = '<tr><td colspan="' + (lookupColumns.length + 1) + '" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
  }
}

function selectAllLookup() {
  var master = document.querySelector('.lookup-table th input');
  var checkboxes = document.querySelectorAll('.lookup-checkbox');
  checkboxes.forEach(function(cb) { cb.checked = master.checked; });
}

function selectLookupRow(row) {
  var checkbox = row.querySelector('.lookup-checkbox');
  checkbox.checked = !checkbox.checked;
}

function confirmLookup() {
  var checkboxes = document.querySelectorAll('.lookup-checkbox:checked');
  if (checkboxes.length === 0) {
    showToast('请选择一条记录', 'warning');
    return;
  }
  
  var item = lookupData.find(function(d) { return d.id === checkboxes[0].value; });
  if (item) {
    var field = document.getElementById(currentLookupField);
    if (field) {
      field.value = item.name;
      field.setAttribute('data-id', item.id);
      field.setAttribute('data-code', item.code);
      
      if (currentLookupType === 'material') {
        var row = field.closest('tr');
        if (row) {
          row.querySelector('.material-name').value = item.name;
          row.querySelector('.material-spec').value = item.specification || '';
          row.querySelector('.material-unit').value = item.unit || '';
        }
      }
    }
  }
  
  closeLookup();
}

function openMaterialLookup(btn) {
  var field = btn.previousElementSibling;
  field.id = 'lookupField_' + Date.now();
  currentLookupField = field.id;
  openLookup(field.id, 'material');
}

function openOrgLookup(btn) {
  var field = btn.previousElementSibling;

}

.lookup-field button { width:28px; height:28px; border:1px solid #e8e8e8; border-left:none; border-radius:0 4px 4px 0; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.lookup-field button:hover { background:#f5f5f5; }

.doc-section-title { font-size: 14px; font-weight: 600; color: #333; padding: 16px 20px 12px; border-top: 1px solid #e8e8e8; margin-top: 16px; }
</style>


</head>


<body>


<div class="doc-page">

  <aside class="doc-sidebar">

    <div class="doc-sidebar-title">业务导航</div>

    <ul class="doc-sidebar-menu">

      <li><a href="purchase-inspect.html"><span class="menu-icon">&#128203;</span> 来料检验单列表</a></li>

      <li><a href="#" class="active"><span class="menu-icon">&#10010;</span> 来料请检通知单新增</a></li>

    </ul>

  </aside>


  <div class="doc-content">

    <header class="doc-header">

      <div>

        <div class="doc-header-title">来料请检通知单</div>

        <div class="doc-header-subtitle">新建来料请检通知单</div>

      </div>

            <div class="doc-toolbar">
        <button class="toolbar-btn" onclick="saveDraft()"><span class="icon">💾</span> 保存草稿</button>
        <button class="toolbar-btn primary" onclick="submitDoc()"><span class="icon">✓</span> 提交审核</button>
        <button class="toolbar-btn" onclick="copyDoc()"><span class="icon">📋</span> 复制</button>
        <button class="toolbar-btn" onclick="prevDoc()"><span class="icon">⬅️</span> 上查</button>
        <button class="toolbar-btn" onclick="nextDoc()"><span class="icon">➡️</span> 下查</button>
        <button class="toolbar-btn" onclick="selectSrcDoc()"><span class="icon">📄</span> 选单</button>
        <button class="toolbar-btn" onclick="reverseApprove()"><span class="icon">↩️</span> 反审核</button>
        <button class="toolbar-btn" onclick="closeDoc()"><span class="icon">🔒</span> 关闭</button>
        <button class="toolbar-btn" onclick="reverseClose()"><span class="icon">🔓</span> 反关闭</button>
        <button class="toolbar-btn" onclick="goToList()"><span class="icon">📋</span> 列表</button>
        <button class="toolbar-btn danger" onclick="exitDoc()"><span class="icon">✖️</span> 退出</button>
      </div>

    </header>


    <div class="doc-body">

      <div id="inspectInfo" class="inspect-info" style="display:none;">
        <div class="inspect-label">来源采购订单: <span class="inspect-value" id="sourceDocNo"></span></div>
      </div>

      <div class="doc-card">
        <div class="doc-form">
          <div class="form-row">
            <div class="form-item">
              <label><span class="required">*</span>单据编号</label>
              <input type="text" id="docNo" readonly class="readonly" placeholder="自动生成">
            </div>
            <div class="form-item">
              <label><span class="required">*</span>日期</label>
              <input type="date" id="docDate">
            </div>
            <div class="form-item">
              <label><span class="required">*</span>组织</label>
              <select id="orgId">
                <option value="">请选择组织</option>
              </select>
            </div>
            <div class="form-item">
              <label>备注</label>
              <textarea id="remark" placeholder="请输入备注"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="doc-card">
        <div class="doc-detail-card">
          <div class="detail-toolbar">
            <div class="detail-toolbar-left">
              <span>请检明细（需检验物料）</span>
              <span style="color:#999;">共 <span id="detailCount">0</span> 行</span>
            </div>
            <div class="detail-toolbar-right">
              <button class="detail-btn primary" onclick="addDetailRow()"><span class="icon">+</span> 添加行</button>
              <button class="detail-btn danger" onclick="removeDetailRow()"><span class="icon">−</span> 删除行</button>
            </div>
          </div>
          <table class="detail-table" id="detailTable">
            <thead>
              <tr>
                <th><input type="checkbox" onclick="selectAllDetails()"></th>
                <th>序号</th>
                <th>物料编码</th>
                <th>物料名称</th>
                <th>规格型号</th>
                <th>单位</th>
                <th>请检数量</th>
                <th>检验项目</th>
                <th>备注</th>
              </tr>
            </thead>
            <tbody id="detailBody">
            </tbody>
          </table>
        </div>
      </div>

    </div>


    <footer class="doc-footer">

      <div class="footer-item">

        <label>合计请检数量:</label>

        <value id="totalQty">0</value>

      </div>

    </footer>

  </div>

</div>


<script>

var currentTab = 'main';
var docData = {};
var sourceData = null;


function init() {
  initLocalData();
  if (window.DocDataStore) DocDataStore.initTestData();
  loadOrgs();
  generateDocNo();
  document.getElementById('docDate').valueAsDate = new Date();
  loadPushData();
}

function initLocalData() {
  localStorage.setItem('erp_materials_cache', JSON.stringify([
    { id: 'mat-001', name: '高频传感器模块', code: 'P-001', specification: 'HT-2026', unit: '个', inspectType: '0', status: 1 },
    { id: 'mat-002', name: '控制电路板', code: 'P-002', specification: 'CB-2026', unit: '块', inspectType: '0', status: 1 },
    { id: 'mat-005', name: '智能控制器', code: 'P-003', specification: 'IC-V3', unit: '台', inspectType: '0', status: 1 },
    { id: 'mat-006', name: '电源模块', code: 'P-004', specification: 'PM-500W', unit: '个', inspectType: '0', status: 1 },
    { id: 'mat-020', name: '工业网关', code: 'P-010', specification: 'GW-2000', unit: '台', inspectType: '1', status: 1 },
    { id: 'mat-010', name: 'PCB电路板', code: 'M-010', specification: 'FR-4双层', unit: '块', inspectType: '0', status: 1 },
    { id: 'mat-011', name: '贴片电阻', code: 'M-011', specification: '10KΩ 0603', unit: '个', inspectType: '0', status: 1 },
    { id: 'mat-012', name: '贴片电容', code: 'M-012', specification: '100μF 0805', unit: '个', inspectType: '0', status: 1 },
    { id: 'mat-008', name: '螺丝', code: 'M-004', specification: 'M4x10', unit: '包', inspectType: '0', status: 1 },
    { id: 'mat-013', name: '变压器', code: 'M-013', specification: '220V→12V', unit: '个', inspectType: '0', status: 1 },
    { id: 'mat-014', name: '散热片', code: 'M-014', specification: '铝制40x40', unit: '片', inspectType: '0', status: 1 },
    { id: 'mat-015', name: '主控芯片', code: 'M-015', specification: 'ARM-A53', unit: '片', inspectType: '1', status: 1 },
    { id: 'mat-016', name: '通信模组', code: 'M-016', specification: '4G+WiFi', unit: '个', inspectType: '1', status: 1 }
  ]));
}

function loadPushData() {
  var pushData = localStorage.getItem('temp_push_data');
  if (!pushData) return;
  
  var data = JSON.parse(pushData);
  if (data.sourceType === 'purchase-order') {
    sourceData = data;
    document.getElementById('orgId').value = data.data.orgId;
    document.getElementById('remark').value = '由采购订单[' + data.sourceNo + ']下推请检';
    document.getElementById('sourceDocNo').textContent = data.sourceNo;
    document.getElementById('inspectInfo').style.display = 'block';
    
    var needInspectRows = data.needInspectRows || [];
    var details = data.data.details || [];
    
    needInspectRows.forEach(function(rowIndex) {
      var item = details[rowIndex];
      if (item) {
        addDetailRow();
        var rows = document.getElementById('detailBody').children;
        var row = rows[rows.length - 1];
        row.querySelector('.material-code').value = item.code;
        row.querySelector('.material-name').value = item.name;
        row.querySelector('.material-spec').value = item.spec;
        row.querySelector('.material-unit').value = item.unit;
        row.querySelector('.qty').value = item.qty;
      }
    });
    
    calcTotal();
    showToast('已从采购订单[' + data.sourceNo + ']带入需检验物料', 'success');
    localStorage.removeItem('temp_push_data');
  }
}

function generateDocNo() {
  var prefix = 'INSP-NOTICE'.toUpperCase();
  var date = new Date();
  var year = date.getFullYear().toString().slice(-2);
  var month = String(date.getMonth() + 1).padStart(2, '0');
  var day = String(date.getDate()).padStart(2, '0');
  var seq = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  document.getElementById('docNo').value = prefix + year + month + day + seq;
}

function loadOrgs() {
  var orgs = JSON.parse(localStorage.getItem('erp_orgs') || '[]');
  var select = document.getElementById('orgId');
  orgs.forEach(function(org) {
    var option = document.createElement('option');
    option.value = org.id;
    option.textContent = org.name;
    select.appendChild(option);
  });
}

function showTab(tab) {
  currentTab = tab;
  var tabs = document.querySelectorAll('.doc-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.remove('active');
  }
  tabs[tab === 'main' ? 0 : 1].classList.add('active');
  document.getElementById('tab-main').style.display = tab === 'main' ? 'block' : 'none';
  document.getElementById('tab-detail').style.display = tab === 'detail' ? 'block' : 'none';
}

function addDetailRow() {
  var tbody = document.getElementById('detailBody');
  var rowCount = tbody.children.length;
  
  var tr = document.createElement('tr');
  tr.innerHTML = '\
    <td><input type="checkbox" class="detail-checkbox"></td>\
    <td>' + (rowCount + 1) + '</td>\
    <td><input type="text" class="material-code" onchange="lookupMaterial(this)"></td>\
    <td><input type="text" class="material-name" readonly></td>\
    <td><input type="text" class="material-spec" readonly></td>\
    <td><input type="text" class="material-unit" readonly></td>\
    <td><input type="number" class="qty" onchange="calcTotal()"></td>\
    <td><input type="text" class="inspect-items" placeholder="外观,尺寸,性能"></td>\
    <td><input type="text" class="remark"></td>\
  ';
  tbody.appendChild(tr);
  updateDetailCount();
}

function removeDetailRow() {
  var checkboxes = document.querySelectorAll('.detail-checkbox:checked');
  if (checkboxes.length === 0) {
    showToast('请选择要删除的行', 'warning');
    return;
  }
  checkboxes.forEach(function(cb) { cb.closest('tr').remove(); });
  renumberRows();
  updateDetailCount();
  calcTotal();
}

function renumberRows() {
  var rows = document.getElementById('detailBody').children;
  for (var i = 0; i < rows.length; i++) {
    rows[i].querySelector('td:nth-child(2)').textContent = i + 1;
  }
}

function selectAllDetails() {
  var master = document.querySelector('.detail-table th input');
  var checkboxes = document.querySelectorAll('.detail-checkbox');
  checkboxes.forEach(function(cb) { cb.checked = master.checked; });
}

function lookupMaterial(input) {
  var code = input.value.trim();
  if (!code) return;
  
  var materials = JSON.parse(localStorage.getItem('erp_materials') || '[]');
  var material = materials.find(function(m) { return m.code === code; });
  
  if (material) {
    var row = input.closest('tr');
    row.querySelector('.material-name').value = material.name;
    row.querySelector('.material-spec').value = material.specification;
    row.querySelector('.material-unit').value = material.unit;
    if (material.inspectType !== '1') {
      showToast('该物料不需要检验', 'warning');
    }
  }
}

function calcTotal() {
  var rows = document.getElementById('detailBody').children;
  var totalQty = 0;
  
  for (var i = 0; i < rows.length; i++) {
    totalQty += parseFloat(rows[i].querySelector('.qty').value) || 0;
  }
  
  document.getElementById('totalQty').textContent = totalQty;
}

function updateDetailCount() {
  document.getElementById('detailCount').textContent = document.getElementById('detailBody').children.length;
}

function validateForm() {
  var docDate = document.getElementById('docDate').value;
  var orgId = document.getElementById('orgId').value;
  
  if (!docDate) {
    showToast('请选择日期', 'warning');
    return false;
  }
  if (!orgId) {
    showToast('请选择组织', 'warning');
    return false;
  }
  
  var detailCount = document.getElementById('detailBody').children.length;
  if (detailCount === 0) {
    showToast('请添加请检明细行', 'warning');
    return false;
  }
  
  return true;
}

function saveDraft() {
  if (!validateForm()) return;
  
  docData = collectDocData();
  docData.status = 'draft';
  
  localStorage.setItem('draft_purchase-inspect-notice', JSON.stringify(docData));
  showToast('草稿已保存', 'success');
}

function submitDoc() {
  if (!validateForm()) return;
  
  docData = collectDocData();
  docData.status = 'pending';
  
  showConfirm('确认提交审核？', function() {
    localStorage.setItem('submitted_purchase-inspect-notice', JSON.stringify(docData));
    
    var list = JSON.parse(localStorage.getItem('erp_purchase-inspect-notice_list') || '[]');
    list.unshift(docData);
    localStorage.setItem('erp_purchase-inspect-notice_list', JSON.stringify(list));
    
    showToast('提交成功，等待审核', 'success');
    setTimeout(function() { window.location.href = 'purchase-inspect.html'; }, 1500);
  });
}

function pushToInspect() {
  if (!validateForm()) return;
  
  docData = collectDocData();
  docData.status = 'inspect';
  
  localStorage.setItem('temp_push_data', JSON.stringify({
    sourceType: 'purchase-inspect-notice',
    sourceId: docData.id,
    sourceNo: docData.docNo,
    data: docData
  }));
  
  showToast('正在跳转到来料检验单创建页面...', 'info');
  setTimeout(function() { window.location.href = 'purchase-inspect-create.html'; }, 1000);
}

function collectDocData() {
  var rows = document.getElementById('detailBody').children;
  var details = [];
  
  for (var i = 0; i < rows.length; i++) {
    details.push({
      code: rows[i].querySelector('.material-code').value,
      name: rows[i].querySelector('.material-name').value,
      spec: rows[i].querySelector('.material-spec').value,
      unit: rows[i].querySelector('.material-unit').value,
      qty: parseFloat(rows[i].querySelector('.qty').value) || 0,
      inspectItems: rows[i].querySelector('.inspect-items').value,
      remark: rows[i].querySelector('.remark').value
    });
  }
  
  return {
    id: 'doc-' + Date.now(),
    docNo: document.getElementById('docNo').value,
    docDate: document.getElementById('docDate').value,
    orgId: document.getElementById('orgId').value,
    orgName: document.getElementById('orgId').options[document.getElementById('orgId').selectedIndex].text,
    remark: document.getElementById('remark').value,
    details: details,
    totalQty: parseFloat(document.getElementById('totalQty').textContent) || 0,
    sourceDocNo: sourceData ? sourceData.sourceNo : '',
    createdAt: new Date().toISOString()
  };
}

function deleteDoc() {
  showConfirm('确认删除此单据？', function() {
    localStorage.removeItem('draft_purchase-inspect-notice');
    showToast('已删除', 'success');
    setTimeout(function() { window.location.href = 'purchase-inspect.html'; }, 1500);
  });
}

document.addEventListener('DOMContentLoaded', init);


</script>



<div class="lookup-modal" id="lookupModal">
  <div class="lookup-dialog">
    <div class="lookup-header">
      <div class="lookup-title" id="lookupTitle">选择</div>
      <button class="lookup-close" onclick="closeLookup()">×</button>
    </div>
    <div class="lookup-body">
      <div class="lookup-search">
        <input type="text" id="lookupKeyword" placeholder="请输入编码或名称搜索" onkeydown="if(event.key==='Enter')filterLookup()">
        <button onclick="filterLookup()">搜索</button>
      </div>
      <table class="lookup-table">
        <thead id="lookupTableHead"></thead>
        <tbody id="lookupTableBody"></tbody>
      </table>
    </div>
    <div class="lookup-footer">
      <button class="btn btn-cancel" onclick="closeLookup()">取消</button>
      <button class="btn btn-primary" onclick="confirmLookup()">确定</button>
    </div>
  </div>
</div>

</body>


</html>
