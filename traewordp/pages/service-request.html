<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务请求 — 磐枢工业智能平台</title>
<link rel="stylesheet" href="../common.css">
<script src="../common.js"></script>
<script></script>
<style>
.doc-page { display:flex; height:100vh; background:#f0f2f5; }
.doc-sidebar { width:220px; background:#fff; border-right:1px solid #e8e8e8; padding:16px 0; }
.doc-sidebar-title { font-size:12px; color:#999; padding:0 16px 8px; }
.doc-sidebar-menu { list-style:none; margin:0; padding:0; }
.doc-sidebar-menu li { margin-bottom:4px; }
.doc-sidebar-menu a { display:flex; align-items:center; gap:8px; padding:8px 16px; color:#666; font-size:13px; text-decoration:none; }
.doc-sidebar-menu a:hover { background:#f5f5f5; }
.doc-sidebar-menu a.active { background:#e6f7ff; color:#1890ff; }
.doc-sidebar-menu .menu-icon { font-size:14px; }
.doc-content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.doc-header { background:#fff; border-bottom:1px solid #e8e8e8; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; }
.doc-header-title { font-size:14px; font-weight:600; color:#333; }
.doc-header-subtitle { font-size:13px; color:#666; }
.doc-toolbar { display:flex; align-items:center; gap:8px; }
.toolbar-btn { display:flex; align-items:center; gap:4px; padding:6px 14px; border:none; background:transparent; font-size:13px; color:#333; cursor:pointer; border-radius:4px; }
.toolbar-btn:hover { background:#e8e8e8; }
.toolbar-btn.primary { color:#1890ff; }
.toolbar-btn.danger { color:#f5222d; }
.toolbar-btn.success { color:#52c41a; }
.toolbar-separator { width:1px; height:20px; background:#ddd; margin:0 4px; }
.doc-body { flex:1; overflow-y:auto; background:#f0f2f5; padding:16px; }
.doc-card { background:#fff; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.06); overflow:hidden; margin-bottom:16px; }
.filter-bar { padding:16px; border-bottom:1px solid #e8e8e8; }
.filter-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
.filter-item { display:flex; flex-direction:column; min-width:160px; }
.filter-item label { font-size:12px; color:#666; margin-bottom:4px; }
.filter-item input, .filter-item select { padding:6px 10px; border:1px solid #e8e8e8; border-radius:4px; font-size:13px; width:150px; }
.filter-actions { display:flex; gap:8px; }
.table-wrapper { padding:16px; overflow-x:auto; }
.data-table { width:100%; border-collapse:collapse; font-size:13px; }
.data-table th { padding:10px 12px; text-align:left; background:#fafafa; color:#666; font-weight:600; border-bottom:1px solid #d9d9d9; white-space:nowrap; font-size:12px; }
.data-table td { padding:10px 12px; border-bottom:1px solid #e8e8e8; color:#333; }
.data-table tr:hover td { background:#f5f7fa; }
.pagination { padding:12px 16px; border-top:1px solid #e8e8e8; display:flex; justify-content:center; align-items:center; gap:16px; }
.btn { padding:6px 16px; border:1px solid #d9d9d9; border-radius:4px; font-size:13px; cursor:pointer; }
.btn-primary { background:#1890ff; color:#fff; border:none; }
.btn-primary:hover { background:#40a9ff; }
.btn-danger { background:#f5222d; color:#fff; border:none; }
.btn-danger:hover { background:#ff4d4f; }
.btn-default { background:#fff; color:#666; }
.btn-default:hover { background:#f5f5f5; }
.btn-cancel { background:#fff; color:#666; border:1px solid #d9d9d9; }
.btn-cancel:hover { background:#f5f5f5; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:1000; justify-content:center; align-items:flex-start; padding-top:36px; }
.modal-overlay.show { display:flex; }
.modal-dialog { background:#fff; border:1px solid #e8e8e8; border-radius:4px; width:480px; max-height:70vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.3); }
.modal-dialog .modal-header { padding:14px 20px; border-bottom:1px solid #e8e8e8; font-weight:600; font-size:15px; color:#333; display:flex; align-items:center; justify-content:space-between; }
.modal-dialog .modal-body { padding:20px; }
.modal-dialog .modal-footer { padding:12px 20px; border-top:1px solid #e8e8e8; display:flex; justify-content:flex-end; gap:8px; }
.modal-close { cursor:pointer; color:#666; font-size:20px; line-height:1; background:none; border:none; padding:0 4px; }
.modal-close:hover { color:#333; }

.column-item { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.column-item input { width:16px; height:16px; }
.column-item label { font-size:13px; color:#333; cursor:pointer; }

.toast { position:fixed; top:60px; right:20px; padding:12px 20px; border-radius:4px; color:#fff; font-size:13px; z-index:9999; animation:toastIn 0.3s ease; }
@keyframes toastIn { from{opacity:0;transform:translateX(100%);}to{opacity:1;transform:translateX(0);} }
.toast-success { background:rgba(34,197,94,0.9); }
.toast-warning { background:rgba(245,158,11,0.9); }
.toast-error { background:rgba(239,68,68,0.9); }
.toast-info { background:rgba(24,144,255,0.9); }

.lookup-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
.lookup-modal.show { display:flex; }
.lookup-dialog { background:#fff; border:1px solid #e8e8e8; border-radius:4px; width:720px; max-height:70vh; overflow:hidden; }
.lookup-header { padding:14px 20px; border-bottom:1px solid #e8e8e8; display:flex; align-items:center; justify-content:space-between; }
.lookup-title { font-size:15px; font-weight:600; color:#333; }
.lookup-close { font-size:20px; color:#666; cursor:pointer; background:none; border:none; }
.lookup-close:hover { color:#333; }
.lookup-body { padding:16px; }
.lookup-search { display:flex; gap:8px; margin-bottom:12px; }
.lookup-search input { flex:1; padding:6px 10px; border:1px solid #e8e8e8; border-radius:4px; font-size:13px; }
.lookup-search button { padding:6px 16px; background:#1890ff; color:#fff; border:none; border-radius:4px; cursor:pointer; }
.lookup-table { width:100%; border-collapse:collapse; font-size:13px; }
.lookup-table th, .lookup-table td { padding:10px 12px; text-align:left; border-bottom:1px solid #e8e8e8; }
.lookup-table th { background:#fafafa; font-weight:600; color:#333; }
.lookup-table tr:hover { background:#f5f5f5; }
.lookup-table .checkbox-cell { width:40px; }
.lookup-footer { padding:12px 20px; border-top:1px solid #e8e8e8; display:flex; justify-content:flex-end; gap:8px; }
</style>
</head>
<body>
<div class="doc-page">
  <aside class="doc-sidebar">
    <div class="doc-sidebar-title">业务导航</div>
    <ul class="doc-sidebar-menu">
      <li><a href="#" class="active"><span class="menu-icon">&#128203;</span> 服务请求列表</a></li>
      <li><a href="service-request-create.html"><span class="menu-icon">&#10010;</span> 服务请求新增</a></li>
      <li><a href="service-dispatch.html"><span class="menu-icon">&#128246;</span> 服务派工</a></li>
      <li><a href="service-record.html"><span class="menu-icon">&#128190;</span> 服务记录</a></li>
      <li><a href="service-return.html"><span class="menu-icon">&#128205;</span> 服务退货</a></li>
    </ul>
  </aside>

  <div class="doc-content">
    <header class="doc-header">
      <div>
        <div class="doc-header-title">服务请求</div>
        <div class="doc-header-subtitle">管理服务请求信息</div>
      </div>
      <div class="doc-toolbar">
        <button class="toolbar-btn" onclick="toggleFilter()"><span class="icon">🔍</span> 过滤</button>
        <button class="toolbar-btn primary" onclick="location.href='service-request-create.html'"><span class="icon">+</span> 新增</button>
        <button class="toolbar-btn" onclick="batchSubmit()"><span class="icon">✓</span> 批量提交</button>
        <button class="toolbar-btn" onclick="batchAudit()"><span class="icon">✅</span> 批量审核</button>
        <button class="toolbar-btn danger" onclick="batchDelete()"><span class="icon">🗑️</span> 批量删除</button>
        <button class="toolbar-btn" onclick="openColumnSettings()"><span class="icon">⚙️</span> 显示/隐藏列</button>
        <button class="toolbar-btn" onclick="exitPage()"><span class="icon">✖️</span> 退出</button>
      </div>
    </header>

    <div class="doc-body">
      <div class="doc-card">
        <div class="filter-bar" id="filterBar">
          <div class="filter-row">
            <div class="filter-item">
              <label>单据编号</label>
              <input type="text" id="filterDocNo" class="form-input" placeholder="请输入单据编号" onkeydown="if(event.key==='Enter')searchData()">
            </div>
            <div class="filter-item">
              <label>客户</label>
              <input type="text" id="filterCustomer" class="form-input" placeholder="请输入客户" onkeydown="if(event.key==='Enter')searchData()">
            </div>
            <div class="filter-item">
              <label>服务类型</label>
              <select id="filterServiceType" class="form-select" onchange="searchData()">
                <option value="">全部类型</option>
                <option value="repair">维修服务</option>
                <option value="maintenance">保养服务</option>
                <option value="consult">技术咨询</option>
                <option value="installation">安装调试</option>
                <option value="training">培训服务</option>
                <option value="other">其他服务</option>
              </select>
            </div>
            <div class="filter-item">
              <label>优先级</label>
              <select id="filterPriority" class="form-select" onchange="searchData()">
                <option value="">全部优先级</option>
                <option value="urgent">紧急</option>
                <option value="high">高</option>
                <option value="medium">中</option>
                <option value="low">低</option>
              </select>
            </div>
            <div class="filter-item">
              <label>状态</label>
              <select id="filterStatus" class="form-select" onchange="searchData()">
                <option value="">全部状态</option>
                <option value="draft">草稿</option>
                <option value="pending_dispatch">待派工</option>
                <option value="in_progress">服务中</option>
                <option value="completed">已完成</option>
                <option value="closed">已关闭</option>
              </select>
            </div>
            <div class="filter-item">
              <label>日期范围</label>
              <input type="date" id="filterStartDate" class="form-input">
              <input type="date" id="filterEndDate" class="form-input">
            </div>
          </div>
          <div class="filter-actions">
            <button class="btn btn-primary" onclick="searchData()">查询</button>
            <button class="btn btn-default" onclick="resetFilter()">重置</button>
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th><input type="checkbox" onclick="selectAll()"></th>
              <th data-column="docNo">单据编号</th>
              <th data-column="date">日期</th>
              <th data-column="customer">客户</th>
              <th data-column="serviceType">服务类型</th>
              <th data-column="priority">优先级</th>
              <th data-column="contact">联系人</th>
              <th data-column="phone">联系电话</th>
              <th data-column="status">状态</th>
              <th data-column="createdAt">创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="dataBody">
          </tbody>
        </table>

        <div class="pagination">
          <button class="btn btn-default" onclick="prevPage()" id="prevBtn">上一页</button>
          <span id="pageInfo">第 1 页 / 共 0 页</span>
          <button class="btn btn-default" onclick="nextPage()" id="nextBtn">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="lookup-modal" id="lookupModal">
  <div class="lookup-dialog">
    <div class="lookup-header">
      <div class="lookup-title" id="lookupTitle">选择</div>
      <button class="lookup-close" onclick="closeLookup()">×</button>
    </div>
    <div class="lookup-body">
      <div class="lookup-search">
        <input type="text" id="lookupKeyword" placeholder="请输入编码或名称搜索" onkeydown="if(event.key==='Enter')filterLookup()">
        <button onclick="filterLookup()">搜索</button>
      </div>
      <table class="lookup-table">
        <thead id="lookupTableHead"></thead>
        <tbody id="lookupTableBody"></tbody>
      </table>
    </div>
    <div class="lookup-footer">
      <button class="btn btn-cancel" onclick="closeLookup()">取消</button>
      <button class="btn btn-primary" onclick="confirmLookup()">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="columnModal">
  <div class="modal-dialog">
    <div class="modal-header"><span>显示/隐藏列</span><button class="modal-close" onclick="closeColumnSettings()">×</button></div>
    <div class="modal-body">
      <div class="column-item"><input type="checkbox" id="col_docNo" checked><label for="col_docNo">单据编号</label></div>
      <div class="column-item"><input type="checkbox" id="col_date" checked><label for="col_date">日期</label></div>
      <div class="column-item"><input type="checkbox" id="col_customer" checked><label for="col_customer">客户</label></div>
      <div class="column-item"><input type="checkbox" id="col_serviceType" checked><label for="col_serviceType">服务类型</label></div>
      <div class="column-item"><input type="checkbox" id="col_priority" checked><label for="col_priority">优先级</label></div>
      <div class="column-item"><input type="checkbox" id="col_contact" checked><label for="col_contact">联系人</label></div>
      <div class="column-item"><input type="checkbox" id="col_phone" checked><label for="col_phone">联系电话</label></div>
      <div class="column-item"><input type="checkbox" id="col_status" checked><label for="col_status">状态</label></div>
      <div class="column-item"><input type="checkbox" id="col_createdAt" checked><label for="col_createdAt">创建时间</label></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeColumnSettings()">取消</button>
      <button class="btn btn-primary" onclick="applyColumnSettings()">确定</button>
    </div>
  </div>
</div>

<script>
var currentPage = 1;
var pageSize = 10;
var totalPages = 0;
var allData = [];
var allColumns = ['docNo', 'date', 'customer', 'serviceType', 'priority', 'contact', 'phone', 'status', 'createdAt'];
var visibleColumns = JSON.parse(localStorage.getItem('service_request_columns') || JSON.stringify(allColumns));

var serviceTypeMap = { 'repair': '维修服务', 'maintenance': '保养服务', 'consult': '技术咨询', 'installation': '安装调试', 'training': '培训服务', 'other': '其他服务' };
var priorityMap = { 'urgent': '紧急', 'high': '高', 'medium': '中', 'low': '低' };
var statusMap = { 'draft': '草稿', 'pending_dispatch': '待派工', 'in_progress': '服务中', 'completed': '已完成', 'closed': '已关闭' };
var statusColorMap = { 'draft': '#999', 'pending_dispatch': '#faad14', 'in_progress': '#1890ff', 'completed': '#52c41a', 'closed': '#666' };

function init() {
  loadColumnSettings();
  loadData();
}

function loadData() {
  allData = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.startsWith('service_request_')) {
      try {
        var item = JSON.parse(localStorage.getItem(key));
        allData.push(item);
      } catch(e) {}
    }
  }
  allData.sort(function(a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
  searchData();
}

function searchData() {
  var docNo = document.getElementById('filterDocNo').value.trim().toLowerCase();
  var customer = document.getElementById('filterCustomer').value.trim().toLowerCase();
  var serviceType = document.getElementById('filterServiceType').value;
  var priority = document.getElementById('filterPriority').value;
  var status = document.getElementById('filterStatus').value;
  var startDate = document.getElementById('filterStartDate').value;
  var endDate = document.getElementById('filterEndDate').value;

  var filtered = allData.filter(function(item) {
    if (docNo && !item.docNo.toLowerCase().includes(docNo)) return false;
    if (customer && !item.customer.toLowerCase().includes(customer)) return false;
    if (serviceType && item.serviceType !== serviceType) return false;
    if (priority && item.priority !== priority) return false;
    if (status && item.status !== status) return false;
    if (startDate && item.date < startDate) return false;
    if (endDate && item.date > endDate) return false;
    return true;
  });

  totalPages = Math.ceil(filtered.length / pageSize);
  document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' 页 / 共 ' + totalPages + ' 页';
  
  var start = (currentPage - 1) * pageSize;
  var end = start + pageSize;
  var pageData = filtered.slice(start, end);
  
  renderTable(pageData);
}

function renderTable(list) {
  var tbody = document.getElementById('dataBody');
  tbody.innerHTML = '';
  
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
    return;
  }
  
  list.forEach(function(item) {
    var row = document.createElement('tr');
    var serviceTypeName = serviceTypeMap[item.serviceType] || item.serviceType;
    var priorityName = priorityMap[item.priority] || item.priority;
    var statusName = statusMap[item.status] || item.status;
    var statusColor = statusColorMap[item.status] || '#666';
    
    row.innerHTML = '<td><input type="checkbox" class="data-checkbox" value="' + item.id + '"></td>' +
      '<td data-column="docNo">' + item.docNo + '</td>' +
      '<td data-column="date">' + item.date + '</td>' +
      '<td data-column="customer">' + (item.customer || '') + '</td>' +
      '<td data-column="serviceType">' + serviceTypeName + '</td>' +
      '<td data-column="priority">' + priorityName + '</td>' +
      '<td data-column="contact">' + (item.contact || '') + '</td>' +
      '<td data-column="phone">' + (item.phone || '') + '</td>' +
      '<td data-column="status"><span style="color:' + statusColor + ';">' + statusName + '</span></td>' +
      '<td data-column="createdAt">' + (item.createdAt ? new Date(item.createdAt).toLocaleString() : '') + '</td>' +
      '<td><button class="btn btn-sm btn-primary" onclick="viewDetail(\' + item.id + )">查看</button> ' +
      '<button class="btn btn-sm btn-default" onclick="editDoc(\' + item.id + )">编辑</button> ' +
      '<button class="btn btn-sm btn-danger" onclick="deleteDoc(\' + item.id + )">删除</button> ' +
      '<button class="btn btn-sm btn-primary" onclick="dispatchDoc(\' + item.id + )">派工</button></td>';
    tbody.appendChild(row);
  });
  
  updateColumnVisibility();
}

function updateColumnVisibility() {
  document.querySelectorAll('th[data-column], td[data-column]').forEach(function(el) {
    var col = el.getAttribute('data-column');
    el.style.display = visibleColumns.includes(col) ? '' : 'none';
  });
}

function toggleFilter() {
  var filterBar = document.getElementById('filterBar');
  filterBar.style.display = filterBar.style.display === 'none' ? '' : 'none';
}

function resetFilter() {
  document.getElementById('filterDocNo').value = '';
  document.getElementById('filterCustomer').value = '';
  document.getElementById('filterServiceType').value = '';
  document.getElementById('filterPriority').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterStartDate').value = '';
  document.getElementById('filterEndDate').value = '';
  currentPage = 1;
  searchData();
}

function selectAll() {
  var master = document.querySelector('.data-table th input');
  var checkboxes = document.querySelectorAll('.data-checkbox');
  checkboxes.forEach(function(cb) { cb.checked = master.checked; });
}

function viewDetail(id) {
  showToast('查看服务请求详情: ' + id, 'info');
}

function editDoc(id) {
  localStorage.setItem('service_request_selected', id);
  location.href = 'service-request-create.html?id=' + id;
}

function deleteDoc(id) {
  showConfirm('确认删除此服务请求？', function() {
    localStorage.removeItem('service_request_' + id);
    showToast('删除成功', 'success');
    loadData();
  });
}

function dispatchDoc(id) {
  var doc = JSON.parse(localStorage.getItem('service_request_' + id));
  if (doc && doc.status === 'draft') {
    showToast('请先提交单据！', 'warning');
    return;
  }
  localStorage.setItem('service_request_selected', id);
  location.href = 'service-dispatch-create.html';
}

function batchSubmit() {
  var checked = document.querySelectorAll('.data-checkbox:checked');
  if (checked.length === 0) {
    showToast('请选择要提交的记录', 'warning');
    return;
  }
  showConfirm('确认批量提交选中的 ' + checked.length + ' 条记录？', function() {
    checked.forEach(function(cb) {
      var id = cb.value;
      var doc = JSON.parse(localStorage.getItem('service_request_' + id));
      if (doc && doc.status === 'draft') {
        doc.status = 'pending_dispatch';
        localStorage.setItem('service_request_' + id, JSON.stringify(doc));
      });
    });
    showToast('批量提交成功', 'success');
    loadData();
  });
}

function batchAudit() {
  var checked = document.querySelectorAll('.data-checkbox:checked');
  if (checked.length === 0) {
    showToast('请选择要审核的记录', 'warning');
    return;
  }
  showConfirm('确认批量审核选中的 ' + checked.length + ' 条记录？', function() {
    checked.forEach(function(cb) {
      var id = cb.value;
      var doc = JSON.parse(localStorage.getItem('service_request_' + id));
      if (doc) {
        doc.status = 'approved';
        localStorage.setItem('service_request_' + id, JSON.stringify(doc));
      });
    });
    showToast('批量审核成功', 'success');
    loadData();
  });
}

function batchDelete() {
  var checked = document.querySelectorAll('.data-checkbox:checked');
  if (checked.length === 0) {
    showToast('请选择要删除的记录', 'warning');
    return;
  }
  showConfirm('确认批量删除选中的 ' + checked.length + ' 条记录？', function() {
    checked.forEach(function(cb) {
      localStorage.removeItem('service_request_' + cb.value);
    });
    showToast('批量删除成功', 'success');
    loadData();
  });
}

function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    searchData();
  }
}

function nextPage() {
  if (currentPage < totalPages) {
    currentPage++;
    searchData();
  }
}

function openColumnSettings() {
  allColumns.forEach(function(col) {
    var cb = document.getElementById('col_' + col);
    if (cb) cb.checked = visibleColumns.includes(col);
  });
  document.getElementById('columnModal').classList.add('show');
}

function closeColumnSettings() {
  document.getElementById('columnModal').classList.remove('show');
}

function applyColumnSettings() {
  visibleColumns = [];
  document.querySelectorAll('#columnModal input[type="checkbox"]').forEach(function(cb) {
    if (cb.checked) {
      visibleColumns.push(cb.id.replace('col_', ''));
    }
  });
  localStorage.setItem('service_request_columns', JSON.stringify(visibleColumns));
  updateColumnVisibility();
  closeColumnSettings();
}

function loadColumnSettings() {
  var saved = localStorage.getItem('service_request_columns');
  if (saved) {
    visibleColumns = JSON.parse(saved);
  }
}

function exitPage() { showConfirm("确认退出？", function() { window.location.href = "../index.html"; }); } });
}

, 3000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
