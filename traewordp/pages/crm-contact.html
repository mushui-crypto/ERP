.column-modal.show{display:flex;}
.column-dialog{background:#fff;border:1px solid #d9d9d9;border-radius:8px;width:560px;min-width:400px;max-width:720px;height:420px;min-height:300px;max-height:70vh;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.15);position:relative;resize:both;}

.column-close{font-size:20px;color:#999;cursor:pointer;border:none;background:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:all 0.3s;cursor:pointer;}
.column-close:hover{background:#f5f5f5;color:#666;}
.column-body{padding:20px;overflow-y:auto;height:calc(100% - 88px);background:#fff;}
.column-footer{padding:14px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:12px;background:#fafafa;position:absolute;bottom:0;left:0;right:0;}
.column-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;transition:all 0.2s;}
.column-item:hover{background:#f5f7fa;}
.column-item input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:#1890ff;}
.column-item label{font-size:14px;color:#333;cursor:pointer;flex:1;}

</script>

<script>



function openModal(id) {



  document.getElementById(id).classList.add('show');



}



function closeModal(id) {



  document.getElementById(id).classList.remove('show');



}



document.querySelectorAll('.modal-overlay').forEach(function(ov) {



  ov.addEventListener('click', function(e) {



    if (e.target === ov) ov.classList.remove('show');



  });



});



document.querySelectorAll('.filter-tab').forEach(function(tab) {



  tab.addEventListener('click', function() {



    this.parentElement.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });



    this.classList.add('active');



  });



});







function validateForm() {



  var modal = document.getElementById('addContactModal');



  var name = modal.querySelector('.form-input[type="text"][placeholder="请输入联系人姓名"]').value.trim();



  var customer = modal.querySelector('.form-select').value;



  var phone = modal.querySelector('.form-input[type="text"][placeholder="请输入手机号码"]').value.trim();



  



  if (!name) {



    showToast('请输入联系人姓名', 'info');



    return false;



  }



  if (!customer || customer === '请选择客户') {



    showToast('请选择所属客户', 'info');



    return false;



  }



  if (!phone) {



    showToast('请输入手机号码', 'info');



    return false;



  }



  return true;











}







function saveContact() {



  if (!validateForm()) return;



  showToast('联系人信息保存成功！', 'info');



  closeModal('addContactModal');







function editContact() {



  var checkboxes = document.querySelectorAll('.row-checkbox:checked');



  if (checkboxes.length === 0) {



    showToast('请选择要修改的联系人', 'info');



    return;



  }



  if (checkboxes.length > 1) {



    showToast('只能选择一个联系人进行修改', 'info');



    return;



  }



  openModal('addContactModal');







function deleteContact() {



  var checkboxes = document.querySelectorAll('.row-checkbox:checked');



  if (checkboxes.length === 0) {



    showToast('请选择要删除的联系人', 'info');



    return;



  }



  showConfirm('确定要删除选中的 ' + checkboxes.length + ' 个联系人吗？', function() {



    showToast('删除成功！', 'info');



  });



}







document.querySelectorAll('.row-action-links a').forEach(function(link) {



  link.addEventListener('click', function(e) {



    e.preventDefault();



    var action = this.textContent;



    if (action === '删除') {



      showConfirm("确认退出？", function(result) { if(result) {



        showToast('删除成功！', 'info');



      } });



    } else if (action === '编辑') {



      openModal('addContactModal');



    } else if (action === '查看') {



      showToast('查看联系人详情', 'info');



    }



  });



});







}



}
var currentLookupField = null;
var currentLookupType = null;
var lookupData = [];
var lookupColumns = [];

function openLookup(fieldId, type) {
  currentLookupField = fieldId;
  currentLookupType = type;
  
  if (type === 'org') {
    lookupColumns = ['编码', '名称', '形态', '上级组织'];
    lookupData = JSON.parse(localStorage.getItem('erp_orgs') || '[]');
    document.getElementById('lookupTitle').textContent = '选择组织';
  } else if (type === 'department') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_departments_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择部门';
  } else if (type === 'employee') {
    lookupColumns = ['编号', '姓名', '所属部门'];
    lookupData = JSON.parse(localStorage.getItem('erp_employees_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择员工';
  } else if (type === 'supplier') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_suppliers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择供应商';
  } else if (type === 'customer') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_customers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择客户';
  } else if (type === 'material') {
    lookupColumns = ['物料编码', '物料名称', '规格型号', '基本单位'];
    lookupData = JSON.parse(localStorage.getItem('erp_materials_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择物料';
  } else if (type === 'warehouse') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_warehouses_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择仓库';
  }
  
  renderLookupTable(lookupData);
  document.getElementById('lookupModal').classList.add('show');
}

function closeLookup() {
  document.getElementById('lookupModal').classList.remove('show');
}

function filterLookup() {
  var keyword = document.getElementById('lookupKeyword').value.trim().toLowerCase();
  var filtered = lookupData.filter(function(item) {
    var code = item.code || '';
    var name = item.name || '';
    return code.toLowerCase().includes(keyword) || name.toLowerCase().includes(keyword);
  });
  renderLookupTable(filtered);
}

function renderLookupTable(data) {
  var head = document.getElementById('lookupTableHead');
  var body = document.getElementById('lookupTableBody');
  
  head.innerHTML = '<tr><th class="checkbox-cell"><input type="checkbox" onclick="selectAllLookup()"></th>' + lookupColumns.map(function(col) { return '<th>' + col + '</th>'; }).join('') + '</tr>';
  
  body.innerHTML = '';
  data.forEach(function(item) {
    var row = document.createElement('tr');
    row.onclick = function() { selectLookupRow(this); };
    var cells = ['<td class="checkbox-cell"><input type="checkbox" class="lookup-checkbox" value="' + item.id + '"></td>'];
    if (currentLookupType === 'org') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.form || '') + '</td><td>' + (item.parentName || '') + '</td>');
    } else if (currentLookupType === 'department') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'employee') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.department || '') + '</td>');
    } else if (currentLookupType === 'supplier' || currentLookupType === 'customer') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'material') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.specification || '') + '</td><td>' + (item.unit || '') + '</td>');
    } else if (currentLookupType === 'warehouse') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    }
    row.innerHTML = cells.join('');
    body.appendChild(row);
  });
  
  if (data.length === 0) {
    body.innerHTML = '<tr><td colspan="' + (lookupColumns.length + 1) + '" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
  }
}

function selectAllLookup() {
  var master = document.querySelector('.lookup-table th input');
  var checkboxes = document.querySelectorAll('.lookup-checkbox');
  checkboxes.forEach(function(cb) { cb.checked = master.checked; });
}

function selectLookupRow(row) {
  var checkbox = row.querySelector('.lookup-checkbox');
  checkbox.checked = !checkbox.checked;
}

function confirmLookup() {
  var checkboxes = document.querySelectorAll('.lookup-checkbox:checked');
  if (checkboxes.length === 0) {
    showToast('请选择一条记录', 'warning');
    return;
  }
  
  var item = lookupData.find(function(d) { return d.id === checkboxes[0].value; });
  if (item) {
    var field = document.getElementById(currentLookupField);
    if (field) {
      field.value = item.name;
      field.setAttribute('data-id', item.id);
      field.setAttribute('data-code', item.code);
      
      if (currentLookupType === 'material') {
        var row = field.closest('tr');
        if (row) {
          row.querySelector('.material-name').value = item.name;
          row.querySelector('.material-spec').value = item.specification || '';
          row.querySelector('.material-unit').value = item.unit || '';
        }
      }
    }
  }
  
  closeLookup();
}

function openMaterialLookup(btn) {
  var field = btn.previousElementSibling;
  field.id = 'lookupField_' + Date.now();
  currentLookupField = field.id;
  openLookup(field.id, 'material');

function updateColumnVisibility() {
  document.querySelectorAll('th[data-column], td[data-column]').forEach(function(el) {
    var col = el.getAttribute('data-column');
    el.style.display = visibleColumns.includes(col) ? '' : 'none';
  });
}

function openColumnSettings() {
  var container = document.getElementById('columnCheckboxes');
  container.innerHTML = '';
  var colLabels = { 'name': '联系人姓名', 'customer': '客户名称', 'position': '职位', 'phone': '电话', 'email': '邮箱', 'createTime': '创建时间' };
  allColumns.forEach(function(col) {
    var item = document.createElement('div');
    item.className = 'column-item';
    var checked = visibleColumns.includes(col) ? 'checked' : '';
    item.innerHTML = '<input type="checkbox" ' + checked + ' value="' + col + '" onchange="toggleColumn(this)">' + '<label>' + (colLabels[col] || col) + '</label>';
    container.appendChild(item);
  });
  document.getElementById('columnModal').classList.add('show');
}

function closeColumnSettings() { document.getElementById('columnModal').classList.remove('show'); }

function toggleColumn(cb) {
  var idx = visibleColumns.indexOf(cb.value);
  if (cb.checked && idx === -1) visibleColumns.push(cb.value);
  else if (!cb.checked && idx !== -1) visibleColumns.splice(idx, 1);
}

function saveColumnSettings() {
  localStorage.setItem('crm_contact_columns', JSON.stringify(visibleColumns));
  showToast('列设置已保存', 'success');
  closeColumnSettings();
  updateColumnVisibility();
}

</script>




<div class="lookup-modal" id="lookupModal">
  <div class="lookup-dialog">
    <div class="lookup-header">
      <div class="lookup-title" id="lookupTitle">选择</div>
      <button class="lookup-close" onclick="closeLookup()">×</button>
    </div>
    <div class="lookup-body">
      <div class="lookup-search">
        <input type="text" id="lookupKeyword" placeholder="请输入编码或名称搜索" onkeydown="if(event.key==='Enter')filterLookup()">
        <button onclick="filterLookup()">搜索</button>
      </div>
      <table class="lookup-table">
        <thead id="lookupTableHead"></thead>
        <tbody id="lookupTableBody"></tbody>
      </table>
    </div>
    <div class="lookup-footer">
      <button class="btn btn-cancel" onclick="closeLookup()">取消</button>
      <button class="btn btn-primary" onclick="confirmLookup()">确定</button>
    </div>
  </div>
</div>
<div class="column-modal" id="columnModal">
  <div class="column-dialog">
    <div class="column-header">
      <div class="column-title">列设置</div>
      <button class="column-close" onclick="closeColumnSettings()">×</button>
    </div>
    <div class="column-body">
      <div id="columnCheckboxes"></div>
    </div>
    <div class="column-footer">
      <button class="btn btn-cancel" onclick="closeColumnSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveColumnSettings()">确定</button>
    </div>
  </div>
</div>

</body>
