<!DOCTYPE html>



<html lang="zh-CN">



<head>



<meta charset="UTF-8">



<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>岗位汇报体系 - 磐枢工业智能平台</title>



<link rel="stylesheet" href="../common.css">



<script src="../common.js"></script>
<script></script>



</head>



<body>



<aside class="sidebar" id="sidebar">



<div class="sidebar-logo">



    <img src="../images/logo.png" alt="磐枢工业智能平台" style="width: 100%; max-width: 200px; margin-bottom: 8px;">



    <h1 style="font-size: 16px; margin: 0;">磐枢工业智能平台</h1>



  </div>



  <nav class="sidebar-menu"></nav>



<div class="sidebar-user"><div class="avatar">管</div>



</aside>



<div class="main-content" id="mainContent">



  <div class="page-header" style="position:sticky;top:0;z-index:100;">



    <div>



      <div class="flex items-center gap-8">



        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>



        <div>



          <h2>岗位汇报体系</h2>



          <div class="breadcrumb"><a href="../index.html">首页</a><span>></span><span>基础管理</span><span>></span><span>公共资料</span><span>></span><span>岗位汇报体系</span></div></div>



        </div>



      </div>



    </div>



    <div class="page-actions">



      <button class="btn btn-ghost btn-sm">&#128276; 消息</button>
      </div>



  </div>



  <div class="page-body" style="display:flex;gap:20px;padding:20px 24px;height:calc(100vh - 56px);">



    <div class="card" style="width:320px;flex-shrink:0;display:flex;flex-direction:column;">



      <div class="card-header">



        <span>岗位树</span>



        <div style="display:flex;gap:8px;">



          <button class="btn btn-sm btn-primary" onclick="addPosition()">新增岗位</button>



          <button class="btn btn-sm btn-ghost" onclick="refreshTree()">刷新</button>



        </div>



      </div>



      <div class="card-body" style="flex:1;overflow-y:auto;padding:8px;">



        <div class="org-tree">



          <div class="org-tree-node" onclick="selectPosition(this, 'P001', '技术总监')">



            <span class="tree-expand" onclick="toggleTreeNode(this)">&#9654;</span>



            <span class="tree-icon">&#128100;</span>



            <span class="tree-label">技术总监</span>



            <div class="org-tree-children">



              <div class="org-tree-node" onclick="selectPosition(this, 'P002', '高级工程师')">



                <span class="tree-expand" onclick="toggleTreeNode(this)">&#9654;</span>



                <span class="tree-icon">&#128100;</span>



                <span class="tree-label">高级工程师</span>



                <div class="org-tree-children">



                  <div class="org-tree-node" onclick="selectPosition(this, 'P003', '工程师')">



                    <span class="tree-expand" onclick="toggleTreeNode(this)">&#9654;</span>



                    <span class="tree-icon">&#128100;</span>



                    <span class="tree-label">工程师</span>



                    <div class="org-tree-children">



                      <div class="org-tree-node" onclick="selectPosition(this, 'P004', '助理工程师')">



                        <span class="tree-expand">&#9679;</span>



                        <span class="tree-icon">&#128100;</span>



                        <span class="tree-label">助理工程师</span>



                      </div>



                    </div>



                  </div>



                </div>



              </div>



            </div>



          </div>



          <div class="org-tree-node" onclick="selectPosition(this, 'P005', '车间主任')">



            <span class="tree-expand" onclick="toggleTreeNode(this)">&#9654;</span>



            <span class="tree-icon">&#128100;</span>



            <span class="tree-label">车间主任</span>



            <div class="org-tree-children">



              <div class="org-tree-node" onclick="selectPosition(this, 'P006', '班组长')">



                <span class="tree-expand" onclick="toggleTreeNode(this)">&#9654;</span>



                <span class="tree-icon">&#128100;</span>



                <span class="tree-label">班组长</span>



                <div class="org-tree-children">



                  <div class="org-tree-node" onclick="selectPosition(this, 'P007', '操作工')">



                    <span class="tree-expand">&#9679;</span>



                    <span class="tree-icon">&#128100;</span>



                    <span class="tree-label">操作工</span>



                  </div>



                </div>



              </div>



            </div>



          </div>



          <div class="org-tree-node" onclick="selectPosition(this, 'P008', '销售经理')">



            <span class="tree-expand" onclick="toggleTreeNode(this)">&#9654;</span>



            <span class="tree-icon">&#128100;</span>



            <span class="tree-label">销售经理</span>



            <div class="org-tree-children">



              <div class="org-tree-node" onclick="selectPosition(this, 'P009', '销售代表')">



                <span class="tree-expand">&#9679;</span>



                <span class="tree-icon">&#128100;</span>



                <span class="tree-label">销售代表</span>



              </div>



            </div>



          </div>



          <div class="org-tree-node" onclick="selectPosition(this, 'P010', '会计')">



            <span class="tree-expand">&#9679;</span>



            <span class="tree-icon">&#128100;</span>



            <span class="tree-label">会计</span>



          </div>



        </div>



      </div>



    </div>



    <div class="card" style="flex:1;display:flex;flex-direction:column;">



      <div class="card-header">



        <span>岗位详情 - <span id="positionName">技术总监</span></span>



        <div style="display:flex;gap:8px;">



          <button class="btn btn-sm btn-primary" onclick="editPosition()">编辑</button>



          <button class="btn btn-sm btn-danger" onclick="deletePosition()">删除</button>



          <button class="btn btn-sm btn-ghost" onclick="refreshData()">刷新</button>



        </div>



      </div>



      <div class="card-body" style="flex:1;overflow-y:auto;padding:0;">



        <div class="detail-tabs">



          <span class="detail-tab active" onclick="switchDetailTab(this, 'basic')">基本信息</span>



          <span class="detail-tab" onclick="switchDetailTab(this, 'sub')">下级岗位</span>



          <span class="detail-tab" onclick="switchDetailTab(this, 'report')">汇报关系</span>



          <span class="detail-tab" onclick="switchDetailTab(this, 'employees')">任职员工</span>



        </div>



        <div class="detail-content">



          <div id="tab-basic" class="detail-tab-content" style="display:block;">



            <div class="form-grid">



              <div class="form-row">



                <div class="form-item"><label>岗位编码</label><input type="text" value="P001" readonly></div>



                <div class="form-item"><label>岗位名称</label><input type="text" value="技术总监" readonly></div>



                <div class="form-item"><label>岗位类型</label><input type="text" value="管理岗" readonly></div>



                <div class="form-item"><label>上级岗位</label><input type="text" value="-" readonly></div>



              </div>



              <div class="form-row">



                <div class="form-item"><label>所属部门</label><input type="text" value="研发部" readonly></div>



                <div class="form-item"><label>岗位等级</label><input type="text" value="一级" readonly></div>



                <div class="form-item"><label>编制人数</label><input type="text" value="1" readonly></div>



                <div class="form-item"><label>启用状态</label><span class="badge badge-success">启用</span></div>



              </div>



              <div class="form-row">



                <div class="form-item" style="flex:1;"><label>岗位职责</label><textarea readonly rows="4">负责公司整体技术战略规划和研发团队管理，推动技术创新和产品升级。</textarea></div>



              </div>



            </div>



          </div>



          <div id="tab-sub" class="detail-tab-content" style="display:none;">



            <div class="table-wrapper"><table class="data-table"><thead><tr><th>岗位编码</th><th>岗位名称</th><th>岗位类型</th><th>编制人数</th><th>操作</th></tr></thead><tbody><tr><td>P002</td><td>高级工程师</td><td>技术岗</td><td>2</td><td class="row-action-links"><a>查看</a></td></tr></tbody></table></div>



          </div>



          <div id="tab-report" class="detail-tab-content" style="display:none;">



            <div class="table-wrapper"><table class="data-table"><thead><tr><th>上级岗位</th><th>汇报对象</th><th>汇报方式</th><th>汇报频率</th></tr></thead><tbody><tr><td>-</td><td>总经理</td><td>会议汇报</td><td>月度</td></tr></tbody></table></div>



          </div>



          <div id="tab-employees" class="detail-tab-content" style="display:none;">



            <div class="table-wrapper"><table class="data-table"><thead><tr><th>工号</th><th>姓名</th><th>任职日期</th><th>转正日期</th><th>任职状态</th></tr></thead><tbody><tr><td>EMP001</td><td>测试人员</td><td>2025-01-01</td><td>2025-01-01</td><td><span class="badge badge-success">在职</span></td></tr></tbody></table></div>



          </div>



        </div>



      </div>



    </div>



  </div>



</div>



<script>



document.querySelectorAll('.filter-tab').forEach(function(tab){tab.addEventListener('click',function(){this.parentElement.querySelectorAll('.filter-tab').forEach(function(t){t.classList.remove('active');});this.classList.add('active');});});



function toggleTreeNode(el) { el.stopPropagation(); var children = el.parentElement.querySelector('.org-tree-children'); if(children) { var isHidden = children.style.display === 'none'; children.style.display = isHidden ? 'block' : 'none'; el.textContent = isHidden ? '\u25BC' : '\u25B6'; } }



function selectPosition(el, code, name) { document.querySelectorAll('.org-tree-node').forEach(function(n) { n.classList.remove('selected'); }); el.classList.add('selected'); document.getElementById('positionName').textContent = name; }



function switchDetailTab(el, type) { document.querySelectorAll('.detail-tab').forEach(function(t) { t.classList.remove('active'); }); el.classList.add('active'); document.querySelectorAll('.detail-tab-content').forEach(function(c) { c.style.display = 'none'; }); document.getElementById('tab-' + type).style.display = 'block'; }



function addPosition() {}



function editPosition() {}



function deletePosition() {}



function refreshTree() {}



function refreshData() {}



</script>



</body>



</html>
