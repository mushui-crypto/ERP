<!DOCTYPE html>



<html lang="zh-CN">



<head>



<meta charset="UTF-8">



<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>资产卡片 — 磐枢工业智能平台</title>



<link rel="stylesheet" href="../common.css">



<script src="../common.js"></script>
<script>
</script>



</head>



<body>







<aside class="sidebar" id="sidebar">



<div class="sidebar-logo">



    <img src="../images/logo.png" alt="磐枢工业智能平台" style="width: 100%; max-width: 200px; margin-bottom: 8px;">



    <h1 style="font-size: 16px; margin: 0;">磐枢工业智能平台</h1>



  </div>



  <nav class="sidebar-menu"></nav>



<div class="sidebar-user"><div class="avatar">管</div>



</aside>







<div class="main-content" id="mainContent">



  <div class="page-header" style="position:sticky;top:0;z-index:100;">



    <div>



      <div class="flex items-center gap-8">



        <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>



        <div>



          <h2>资产卡片</h2>



          <div class="breadcrumb"><a href="../index.html">首页</a><span>&gt;</span><a href="#">财务会计</a><span>&gt;</span><a href="#">固定资产</a><span>&gt;</span><span>资产卡片</span></div></div>



        </div>



      </div>



    </div>



    <div class="page-actions">



      <button class="btn btn-ghost btn-sm">&#128276; 消息</button>
      </div>



  </div>







  <div class="page-body list-page-body">



    <div class="list-action-bar">



      <button class="action-btn" onclick="handleActionBtn(this)">过滤</button>



      <button class="action-btn" onclick="handleActionBtn(this)">刷新</button>



      <span class="action-separator"></span>



      <button class="action-btn" onclick="handleActionBtn(this)">新增</button>



      <button class="action-btn" onclick="handleActionBtn(this)">删除</button>



      <button class="action-btn" onclick="handleActionBtn(this)">修改</button>



      <span class="action-separator"></span>



      <button class="action-btn" onclick="handleActionBtn(this)">退出</button>



    </div>



    <div class="list-filter-section">



      <div class="list-filter-tabs">



        <span class="filter-tab active">默认方案</span>



        <span class="filter-tab">全部</span>



        <span class="filter-tab">在用</span>



        <span class="filter-tab">闲置</span>



        <span class="filter-tab">报废</span>



      </div>



      <div class="list-filter-row">



        <div class="filter-field">



          <label>资产编码</label>



          <input type="text" class="form-input" placeholder="请输入资产编码">



        </div>



        <div class="filter-field">



          <label>资产类别</label>



          <select class="form-select"><option value="">全部</option><option>生产设备</option><option>办公设备</option><option>运输设备</option></select>



        </div>



      </div>



      <div class="list-filter-btns">



        <button class="btn-search">&#128269; 查询</button>



        <button class="btn-save">&#128190; 保存方案</button>



        <button class="btn-reset">&#8634; 重置</button>



      </div>



    </div>



    <div class="list-table-area">



      <table class="data-table">



        <thead>



          <tr>



            <th style="width:40px;"><input type="checkbox" class="row-checkbox"></th>



            <th>资产编码</th>



            <th>资产名称</th>



            <th>资产类别</th>



            <th>规格型号</th>



            <th>存放地点</th>



            <th>使用部门</th>



            <th style="text-align:right; font-family:var(--font-mono);">原值</th>



            <th style="text-align:right; font-family:var(--font-mono);">累计折旧</th>



            <th style="text-align:right; font-family:var(--font-mono);">净值</th>



            <th>状态</th>



            <th>操作</th>



          </tr>



        </thead>



        <tbody><tr><td colspan="100%" style="text-align:center;color:var(--text-tertiary);padding:20px;">暂无数据</td></tr></tbody>



      </table>



      <div class="list-pagination">



        <span class="page-info">共 8 条记录，每页 20 条</span>



        <span class="page-btn">&laquo;</span>



        <span class="page-btn active">1</span>



        <span class="page-btn">&raquo;</span>



      </div>



    </div>



  </div>



</div>







<script>
function openModal(){ var m=document.querySelector('.modal-overlay'); if(m) m.classList.add('show'); }
function closeModal(){ document.querySelectorAll('.modal-overlay,.lookup-modal').forEach(function(m){m.classList.remove('show');}); }
function showToast(msg,type){ if(window.parent&&window.parent.showToast) window.parent.showToast(msg,type); else console.log(type||'info',msg); }
function showConfirm(msg,type,cb){ if(typeof type==='function'){cb=type;} if(!cb||confirm(msg)) cb&&cb(true); }
function handleActionBtn(){ showToast('P2 资产卡片已切换真实 API 面板','info'); }
function handleDelete(){ showToast('P2 资产卡片删除不在本阶段浏览器验收范围','warning'); }
function handleSubmit(){ showToast('P2 资产卡片由资产验收/其他出库审核生成','info'); }
function handleAudit(){ showToast('P2 资产卡片由后端规则生成','info'); }
</script>




<div class="lookup-modal" id="lookupModal">
  <div class="lookup-dialog">
    <div class="lookup-header">
      <div class="lookup-title" id="lookupTitle">选择</div>
      <button class="lookup-close" onclick="closeLookup()">×</button>
    </div>
    <div class="lookup-body">
      <div class="lookup-search">
        <input type="text" id="lookupKeyword" placeholder="请输入编码或名称搜索" onkeydown="if(event.key==='Enter')filterLookup()">
        <button onclick="filterLookup()">搜索</button>
      </div>
      <table class="lookup-table">
        <thead id="lookupTableHead"></thead>
        <tbody id="lookupTableBody"></tbody>
      </table>
    </div>
    <div class="lookup-footer">
      <button class="btn btn-cancel" onclick="closeLookup()">取消</button>
      <button class="btn btn-primary" onclick="confirmLookup()">确定</button>
    </div>
  </div>
</div>

<script src="../purchase-p2-asset-api.js"></script>
</body>



</html>
