<script src="../doc-data-store.js">
var currentLookupField = null;
var currentLookupType = null;
var lookupData = [];
var lookupColumns = [];

function openLookup(fieldId, type) {
  currentLookupField = fieldId;
  currentLookupType = type;
  
  if (type === 'org') {
    lookupColumns = ['编码', '名称', '形态', '上级组织'];
    lookupData = JSON.parse(localStorage.getItem('erp_orgs') || '[]');
    document.getElementById('lookupTitle').textContent = '选择组织';
  } else if (type === 'department') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_departments_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择部门';
  } else if (type === 'employee') {
    lookupColumns = ['编号', '姓名', '所属部门'];
    lookupData = JSON.parse(localStorage.getItem('erp_employees_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择员工';
  } else if (type === 'supplier') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_suppliers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择供应商';
  } else if (type === 'customer') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_customers_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择客户';
  } else if (type === 'material') {
    lookupColumns = ['物料编码', '物料名称', '规格型号', '基本单位'];
    lookupData = JSON.parse(localStorage.getItem('erp_materials_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择物料';
  } else if (type === 'warehouse') {
    lookupColumns = ['编码', '名称'];
    lookupData = JSON.parse(localStorage.getItem('erp_warehouses_cache') || '[]');
    document.getElementById('lookupTitle').textContent = '选择仓库';
  }
  
  renderLookupTable(lookupData);
  document.getElementById('lookupModal').classList.add('show');
}

function closeLookup() {
  document.getElementById('lookupModal').classList.remove('show');
}

function filterLookup() {
  var keyword = document.getElementById('lookupKeyword').value.trim().toLowerCase();
  var filtered = lookupData.filter(function(item) {
    var code = item.code || '';
    var name = item.name || '';
    return code.toLowerCase().includes(keyword) || name.toLowerCase().includes(keyword);
  });
  renderLookupTable(filtered);
}

function renderLookupTable(data) {
  var head = document.getElementById('lookupTableHead');
  var body = document.getElementById('lookupTableBody');
  
  head.innerHTML = '<tr><th class="checkbox-cell"><input type="checkbox" onclick="selectAllLookup()"></th>' + lookupColumns.map(function(col) { return '<th>' + col + '</th>'; }).join('') + '</tr>';
  
  body.innerHTML = '';
  data.forEach(function(item) {
    var row = document.createElement('tr');
    row.onclick = function() { selectLookupRow(this); };
    var cells = ['<td class="checkbox-cell"><input type="checkbox" class="lookup-checkbox" value="' + item.id + '"></td>'];
    if (currentLookupType === 'org') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.form || '') + '</td><td>' + (item.parentName || '') + '</td>');
    } else if (currentLookupType === 'department') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'employee') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.department || '') + '</td>');
    } else if (currentLookupType === 'supplier' || currentLookupType === 'customer') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    } else if (currentLookupType === 'material') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td><td>' + (item.specification || '') + '</td><td>' + (item.unit || '') + '</td>');
    } else if (currentLookupType === 'warehouse') {
      cells.push('<td>' + item.code + '</td><td>' + item.name + '</td>');
    }
    row.innerHTML = cells.join('');
    body.appendChild(row);
  });
  
  if (data.length === 0) {
    body.innerHTML = '<tr><td colspan="' + (lookupColumns.length + 1) + '" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
  }
}

function selectAllLookup() {
  var master = document.querySelector('.lookup-table th input');
  var checkboxes = document.querySelectorAll('.lookup-checkbox');
  checkboxes.forEach(function(cb) { cb.checked = master.checked; });
}

function selectLookupRow(row) {
  var checkbox = row.querySelector('.lookup-checkbox');
  checkbox.checked = !checkbox.checked;
}

function confirmLookup() {
  var checkboxes = document.querySelectorAll('.lookup-checkbox:checked');
  if (checkboxes.length === 0) {
    showToast('请选择一条记录', 'warning');
    return;
  }
  
  var item = lookupData.find(function(d) { return d.id === checkboxes[0].value; });
  if (item) {
    var field = document.getElementById(currentLookupField);
    if (field) {
      field.value = item.name;
      field.setAttribute('data-id', item.id);
      field.setAttribute('data-code', item.code);
      
      if (currentLookupType === 'material') {
        var row = field.closest('tr');
        if (row) {
          row.querySelector('.material-name').value = item.name;
          row.querySelector('.material-spec').value = item.specification || '';
          row.querySelector('.material-unit').value = item.unit || '';
        }
      }
    }
  }
  
  closeLookup();
}

function openMaterialLookup(btn) {
  var field = btn.previousElementSibling;
  field.id = 'lookupField_' + Date.now();
  currentLookupField = field.id;
  openLookup(field.id, 'material');
}

function openOrgLookup(btn) {
  var field = btn.previousElementSibling;
  field.id = 'lookupField_' + Date.now();
  currentLookupField = field.id;

}

  var field = btn.previousElementSibling;

}

function openWarehouseLookup(btn) {
  var field = btn.previousElementSibling;
  field.id = 'lookupField_' + Date.now();

}

<style>

}

}

          <tbody id="pdTableBody"></tbody>




        </table>




      </div>




      <div class="modal-footer">




        <button class="action-btn" onclick="closeModal('pushDownModal')">编辑</button>




        <button class="action-btn primary-action" onclick="confirmPushDown()">批量操作</button>




      </div>




    </div>




  </div>









  <!-- 编辑 -->




  <div class="modal-overlay" id="chainModal" onclick="if(event.target===this)closeModal('chainModal')">




    <div class="modal-dialog">




      <div class="modal-header">




        <span id="chainTitle"></span>




        <button class="modal-close" onclick="closeModal('chainModal')">&times;</button>




      </div>




      <div class="modal-body">




        <p style="font-size:12px;color:#666;margin-bottom:8px;" id="chainDesc"></p>




        <table class="data-table">




          <thead><tr>




            <th></th>




            <th>导入数据?</th>




            <th>删除</th>




          </tr></thead>




          <tbody id="chainTableBody"></tbody>




        </table>




      </div>




      <div class="modal-footer">




        <button class="action-btn" onclick="closeModal('chainModal')">编辑</button>




      </div>




    </div>




  </div>




</div>









<script>




var DOC_TYPE = 'sales_return_notice';




var allDocs = [];




var currentData = [];




var currentPage = 1;




var pageSize = 10;




var currentFilterStatus = '编辑';









function initData() {




  if (window.DocDataStore) DocDataStore.initTestData();




  allDocs = window.DocDataStore ? DocDataStore.listDocs(DOC_TYPE) : [];




  applyFilter();




}









function applyFilter() {




  if (currentFilterStatus === '编辑') {




    currentData = allDocs.slice();




  } else if (currentFilterStatus === '导入数据?') {




    currentData = allDocs.filter(function(d) { return d.status === DocDataStore.STATUS.DRAFT || d.status === DocDataStore.STATUS.SUBMITTED; });




  } else if (currentFilterStatus === '导入数据?') {




    currentData = allDocs.filter(function(d) { return d.status === DocDataStore.STATUS.APPROVED || d.status === DocDataStore.STATUS.PUSHED; });




  } else if (currentFilterStatus === '导入数据') {




    currentData = allDocs.filter(function(d) { return d.status === DocDataStore.STATUS.CLOSED; });




  } else {




    currentData = allDocs.slice();




  }




  currentPage = 1;




  renderTable();




  updatePagination();




}









function fmtMoney(v) { return (parseFloat(v) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }




function fmtQty(v) { return (parseFloat(v) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }









function renderTable() {




  var tbody = document.getElementById('table-body');




  tbody.innerHTML = '';




  var start = (currentPage - 1) * pageSize;




  var pageData = currentData.slice(start, start + pageSize);




  if (pageData.length === 0) {




    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#666;padding:20px;"></td></tr>';




    return;




  }




  pageData.forEach(function(item) {




    var statusText = DocDataStore.STATUS_LABELS[item.status] || '编辑';




    var statusClass = item.status === 0 ? 'badge-info' : item.status === 1 ? 'badge-warning' : (item.status === 2 || item.status === 3) ? 'badge-success' : 'badge-error';




    var totalQty = 0, totalAmount = 0;




    (item.details || []).forEach(function(d) {




      totalQty += parseFloat(d.qty) || 0;




      totalAmount += parseFloat(d.totalAmount) || parseFloat(d.amount) || 0;




    });




    var editUrl = 'sales-return-create.html?id=' + item.id;




    var row = '<tr data-id="' + item.id + '">';




    row += '<td><input type="checkbox" class="row-checkbox" data-id="' + item.id + '"></td>';




    row += '<td><a href="' + editUrl + '" style="color:var(--text-accent)">' + item.docNo + '</a></td>';




    row += '<td>' + (item.header.sourceDocNo || '') + '</td>';




    row += '<td>' + (item.header.sourceOrderNo || '') + '</td>';




    row += '<td>' + (item.header.customerName || '') + '</td>';




    row += '<td>' + (item.header.returnDate || item.header.outboundDate || '') + '</td>';




    row += '<td style="text-align:right;font-family:monospace">' + fmtQty(totalQty) + '</td>';




    row += '<td style="text-align:right;font-family:monospace">' + fmtMoney(totalAmount) + '</td>';




    row += '<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>';




    row += '<td class="row-action-links">';




    row += '<a href="' + editUrl + '">删除</a> ';




    if (item.status === 0) row += '<a href="#" onclick="submitDoc(\' + item.id + );return false;">删除</a> ';




    if (item.status === 1) row += '<a href="#" onclick="approveDoc(\' + item.id + );return false;">编辑</a> ';




    if (item.status === 2 || item.status === 3) row += '<a href="#" onclick="pushDownDoc(\' + item.id + );return false;">导入数据</a> ';




    row += '<a href="#" onclick="queryUp(\' + item.id + );return false;">编辑</a> ';




    row += '<a href="#" onclick="queryDown(\' + item.id + );return false;">编辑</a> ';




    if (item.status === 0) row += '<a href="#" onclick="deleteDoc(\' + item.id + );return false;" style="color:var(--color-error);">编辑</a>';




    row += '</td>';




    row += '</tr>';




    tbody.innerHTML += row;




  });




}









function updatePagination() {




  var total = currentData.length;




  var pages = Math.max(1, Math.ceil(total / pageSize));




  document.getElementById('total-count').textContent = total;




  document.getElementById('current-page').textContent = currentPage;




  document.getElementById('total-pages').textContent = pages;




  var pageNumbers = '';




  for (var i = 1; i <= pages; i++) {




    pageNumbers += '<button' + (i === currentPage ? ' class="active"' : '') + ' onclick="goToPage(' + i + ')">' + i + '</button>';




  }




  document.getElementById('page-numbers').innerHTML = pageNumbers;




}









function goToPage(page) { if (page >= 1 && page <= Math.ceil(currentData.length / pageSize)) { currentPage = page; renderTable(); updatePagination(); } }




function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); updatePagination(); } }




function nextPage() { if (currentPage < Math.ceil(currentData.length / pageSize)) { currentPage++; renderTable(); updatePagination(); } }




function toggleAll(cb) {




  document.querySelectorAll('.row-checkbox').forEach(function(c) { c.checked = cb.checked; });




}




function showFilter() { showToast('导入数据', 'info'); }




function refreshPage() { initData(); showToast('?', 'success'); }









function searchDocs() {




  var docNo = document.getElementById('filter-docNo').value.trim();




  var customer = document.getElementById('filter-customer').value.trim();




  currentData = allDocs.filter(function(d) {




    if (docNo && !(d.docNo || '').includes(docNo)) return false;




    if (customer && !(d.header.customerName || '').includes(customer)) return false;




    return true;




  });




  currentPage = 1;




  renderTable();




  updatePagination();




  showToast('? ' + currentData.length + ' 删除', 'info');




}









function resetFilter() {




  document.getElementById('filter-docNo').value = '';




  document.getElementById('filter-customer').value = '';




  document.getElementById('filter-date').value = '';




  currentFilterStatus = '编辑';




  applyFilter();




}









function getSelectedIds() {




  var ids = [];




  document.querySelectorAll('.row-checkbox:checked').forEach(function(cb) { ids.push(cb.getAttribute('data-id')); });




  return ids;




}









function deleteDoc(id) {




  var doc = DocDataStore.getDoc(DOC_TYPE, id);




  if (!doc) return;




  if (doc.status >= DocDataStore.STATUS.SUBMITTED) { showToast('?', 'warning'); return; }




  showConfirm('删除 ' + doc.docNo + '删除', 'warning', function(result, function() {




    if (result) {




      DocDataStore.deleteDoc(DOC_TYPE, id);




      initData();




      showToast('导入数据删除', 'success');




    });




  });




}









function deleteSelected() {




  var ids = getSelectedIds();




  if (ids.length === 0) { showToast('导入数据删除', 'warning'); return; }




  showConfirm('编辑 ' + ids.length + ' 导入数据', 'warning', function(result, function() {




    if (result) {




      var ok = 0;




      ids.forEach(function(id) { if (DocDataStore.deleteDoc(DOC_TYPE, id)) ok++; });




      initData();




      showToast('导入数据? ' + ok + ' 编辑', 'success');




    }




  });




}









function submitDoc(id) {




  showConfirm('删除', 'warning', function(result, function() {




    if (result) {




      try { DocDataStore.submitDoc(DOC_TYPE, id); initData(); showToast('导入数据?', 'success'); });




      catch (e) { showToast('导入数据删除' + e.message, 'error'); }




    }




  });




}









function submitSelected() {




  var ids = getSelectedIds();




  if (ids.length === 0) { showToast('导入数据?', 'warning'); return; }




  showConfirm('导入数据删除', 'warning', function(result, function() {




    if (result) {




      var ok = 0;




      ids.forEach(function(id) { try { DocDataStore.submitDoc(DOC_TYPE, id); ok++; }); catch (e) {} });




      initData();




      showToast('导入数据 ' + ok + ' 删除', 'success');




    }




  });




}









function approveDoc(id) {




  showConfirm('编辑', 'warning', function(result, function() {




    if (result) {




      try { DocDataStore.approveDoc(DOC_TYPE, id); initData(); showToast('导入数据?', 'success'); });




      catch (e) { showToast('批量操作' + e.message, 'error'); }




    }




  });




}









function auditSelected() {




  var ids = getSelectedIds();




  if (ids.length === 0) { showToast('导入数据?', 'warning'); return; }




  showConfirm('批量操作', 'warning', function(result, function() {




    if (result) {




      var ok = 0;




      ids.forEach(function(id) { try { DocDataStore.approveDoc(DOC_TYPE, id); ok++; }); catch (e) {} });




      initData();




      showToast('导入数据? ' + ok + ' 删除', 'success');




    }




  });




}









function antiSubmitSelected() { showToast('导入数据删除', 'info'); }




function antiAuditSelected() { showToast('导入数据删除', 'info'); }









/** 批量操作 */




function pushDownSelected() { openPushDownModal(null); }




function pushDownDoc(id) { openPushDownModal(id); }









function openPushDownModal(singleId) {




  var pushable = DocDataStore.getPushableDocs(DOC_TYPE);




  var rows = [];




  pushable.forEach(function(doc) {




    if (singleId && doc.id !== singleId) return;




    (doc.details || []).forEach(function(d, idx) {




      var qty = parseFloat(d.qty) || 0;




      var ret = parseFloat(d.returnedQty) || 0;




      var unReturn = Math.max(0, qty - ret);




      if (unReturn > 0) {




        rows.push({




          docId: doc.id, docNo: doc.docNo, customer: doc.header.customerName,




          detailIndex: idx, materialCode: d.materialCode, materialName: d.materialName, unit: d.unit,




          qty: qty, returned: ret, unReturn: unReturn




        });




      }




    });




  });




  var tbody = document.getElementById('pdTableBody');




  if (rows.length === 0) {




    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#666;padding:16px;">批量操作</td></tr>';




  } else {




    tbody.innerHTML = rows.map(function(r) {




      return '<tr data-doc="' + r.docId + '" data-idx="' + r.detailIndex + '" data-remaining="' + r.unReturn + '">' +




        '<td><input type="checkbox" class="pd-checkbox" checked></td>' +




        '<td>' + r.docNo + '</td><td>' + r.customer + '</td>' +




        '<td>' + r.materialCode + '</td><td>' + r.materialName + '</td><td>' + r.unit + '</td>' +




        '<td style="text-align:right;font-family:monospace">' + fmtQty(r.qty) + '</td>' +




        '<td style="text-align:right;font-family:monospace">' + fmtQty(r.returned) + '</td>' +




        '<td style="text-align:right;font-family:monospace">' + fmtQty(r.unReturn) + '</td>' +




        '<td><input type="text" class="pd-qty" value="' + r.unReturn + '" style="text-align:right;width:90px;" onchange="pdQtyChange(this)"></td>' +




        '</tr>';




    }).join('');




  }




  openModal('pushDownModal');




}









function pdToggleAll(cb) {




  document.querySelectorAll('.pd-checkbox').forEach(function(c) { c.checked = cb.checked; });




}




function pdQtyChange(input) {




  var tr = input.closest('tr');




  var remaining = parseFloat(tr.getAttribute('data-remaining')) || 0;




  var v = parseFloat(input.value) || 0;




  if (v > remaining) { input.value = remaining; showToast(' ' + remaining, 'warning'); }




}









function confirmPushDown() {




  var selectedRows = [];




  var trs = document.querySelectorAll('#pdTableBody tr[data-doc]');




  trs.forEach(function(tr) {




    var cb = tr.querySelector('.pd-checkbox');




    if (!cb || !cb.checked) return;




    var qty = parseFloat(tr.querySelector('.pd-qty').value) || 0;




    if (qty <= 0) return;




    selectedRows.push({ docId: tr.getAttribute('data-doc'), detailIndex: parseInt(tr.getAttribute('data-idx')), qty: qty });




  });




  if (selectedRows.length === 0) { showToast('导入数据', 'warning'); return; }




  try {




    var firstDoc = DocDataStore.getDoc(DOC_TYPE, selectedRows[0].docId);




    var header = {




      customerName: firstDoc.header.customerName,




      sourceDocNo: firstDoc.docNo,




      sourceOrderNo: firstDoc.header.sourceOrderNo || '',




      returnDate: new Date().toISOString().slice(0, 10),




      warehouse: firstDoc.header.warehouse || '',




      warehouseName: firstDoc.header.warehouseName || '',




      remark: '批量操作 ' + firstDoc.docNo + ' '




    };




    var newDoc = DocDataStore.pushDown(DOC_TYPE, selectedRows, 'sales_return', header);




    closeModal('pushDownModal');




    showToast('导入数据?' + newDoc.docNo, 'success');




    initData();




  } catch (e) {




    showToast('' + e.message, 'error');




  }




}









/** 编辑/编辑 */




function queryUp(id) { showChain(id, 'up'); }




function queryDown(id) { showChain(id, 'down'); }




function queryUpSelected() {




  var ids = getSelectedIds();




  if (ids.length === 0) { showToast('导入数据?', 'warning'); return; }




  showChain(ids[0], 'up');




}




function queryDownSelected() {




  var ids = getSelectedIds();




  if (ids.length === 0) { showToast('导入数据?', 'warning'); return; }




  showChain(ids[0], 'down');




}









function showChain(docId, direction) {




  var chain = DocDataStore.getDocChain(DOC_TYPE, docId, direction);




  var doc = DocDataStore.getDoc(DOC_TYPE, docId);




  var docNoLabel = doc ? doc.docNo : docId;




  document.getElementById('chainTitle').textContent = direction === 'up' ? '删除' : '删除';




  document.getElementById('chainDesc').textContent = '' + docNoLabel + '导入数据 ' + chain.length + ' 导入数据删除';




  var tbody = document.getElementById('chainTableBody');




  if (chain.length === 0) {




    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#666;padding:16px;">?</td></tr>';




  } else {




    tbody.innerHTML = chain.map(function(c) {




      var typeLabel = DocDataStore.DOC_TYPES[c.docType] ? DocDataStore.DOC_TYPES[c.docType].name : c.docType;




      return '<tr><td>' + typeLabel + '</td><td>' + c.docNo + '</td><td><span class="badge badge-info">' + (c.statusLabel || '') + '</span></td></tr>';




    }).join('');




  }




  openModal('chainModal');




}









function exitPage() { window.location.href = '../index.html'; }









function openModal(id) { document.getElementById(id).classList.add('show'); }




function closeModal(id) { document.getElementById(id).classList.remove('show'); }









document.querySelectorAll('.filter-tab').forEach(function(tab) {




  tab.addEventListener('click', function() {




    this.parentElement.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });




    this.classList.add('active');




    var tabText = this.textContent.trim();




    if (['导入数据删除', '导入数据?', '导入数据?', '导入数据'].includes(tabText)) {




      currentFilterStatus = (tabText === '导入数据删除') ? '编辑' : tabText;




      applyFilter();




    } else if (['导入数据', '导入数据', '导入数据', '导入数据删除'].includes(tabText)) {




      filterByTime(tabText);




    }




  });




});









function filterByTime(range) {




  var now = new Date();




  var start = null;




  if (range === '导入数据') { start = new Date(now.getFullYear(), now.getMonth(), now.getDate()); }




  else if (range === '导入数据') { var day = now.getDay() || 7; start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 1); }




  else if (range === '导入数据') { start = new Date(now.getFullYear(), now.getMonth(), 1); }




  else if (range === '导入数据删除') { var q = Math.floor(now.getMonth() / 3); start = new Date(now.getFullYear(), q * 3, 1); }




  if (!start) { applyFilter(); return; }




  currentData = allDocs.filter(function(d) {




    var dStr = d.header.returnDate || d.header.outboundDate || d.header.createDate || '';




    if (!dStr) return false;




    var dd = new Date(dStr);




    return dd >= start && dd <= now;




  });




  currentPage = 1;




  renderTable();




  updatePagination();




  showToast('导入数据?' + range, 'info');




}









document.addEventListener('DOMContentLoaded', function() {




  initData();




});





</script>





<div class="lookup-modal" id="lookupModal">
  <div class="lookup-dialog">
    <div class="lookup-header">
      <div class="lookup-title" id="lookupTitle">选择</div>
      <button class="lookup-close" onclick="closeLookup()">×</button>
    </div>
    <div class="lookup-body">
      <div class="lookup-search">
        <input type="text" id="lookupKeyword" placeholder="请输入编码或名称搜索" onkeydown="if(event.key==='Enter')filterLookup()">
        <button onclick="filterLookup()">搜索</button>
      </div>
      <table class="lookup-table">
        <thead id="lookupTableHead"></thead>
        <tbody id="lookupTableBody"></tbody>
      </table>
    </div>
    <div class="lookup-footer">
      <button class="btn btn-cancel" onclick="closeLookup()">取消</button>
      <button class="btn btn-primary" onclick="confirmLookup()">确定</button>
    </div>
  </div>
</div>

</body>




</html>
