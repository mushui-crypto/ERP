function executeFilter() {
  var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
  var rows = document.querySelectorAll('#filterTableBody tr');
  var matchAll = document.getElementById('filterOptionMatchAll').checked;
  var filtered = list.filter(function(item) {
    var result = true;
    var prevLogic = 'and';
    var hasValidCondition = false;
    for (var i = 0; i < rows.length; i++) {
      var field = rows[i].querySelector('.filter-field').value;
      var operator = rows[i].querySelector('.filter-operator').value;
      var value = rows[i].querySelector('.filter-value').value.trim();
      var logic = rows[i].querySelector('.filter-logic').value;
      if (!field) continue;
      hasValidCondition = true;
      var rowResult = applyFilterCondition(item, field, operator, value, matchAll);
      if (i === 0) {
        result = rowResult;
      } else {
        if (prevLogic === 'and') {
          result = result && rowResult;
        } else {
          result = result || rowResult;
        }
      }
      prevLogic = logic;
    }
    return hasValidCondition ? result : true;
  });
  var orderField = document.getElementById('orderField').value;
  var orderDirection = document.getElementById('orderDirection').value;
  filtered.sort(function(a, b) {
    var valA = a[orderField] || '';
    var valB = b[orderField] || '';
    if (typeof valA === 'number' && typeof valB === 'number') {
      return orderDirection === 'asc' ? valA - valB : valB - valA;
    }
    return orderDirection === 'asc' ? String(valA).localeCompare(valB) : String(valB).localeCompare(valA);
  });
  closeFilterModal();
  renderTable(filtered);
}
function applyFilterCondition(item, field, operator, value, matchAll) {
  var itemValue = item[field] || item[field.replace(/([A-Z])/g, '_$1').toLowerCase()] || '';
  var itemStr = String(itemValue).toLowerCase();
  var valueStr = String(value).toLowerCase();
  switch (operator) {
    case '=': return matchAll ? itemStr === valueStr : itemStr.includes(valueStr);
    case '<>': return matchAll ? itemStr !== valueStr : !itemStr.includes(valueStr);
    case 'like': return itemStr.includes(valueStr);
    case 'notlike': return !itemStr.includes(valueStr);
    case '>': return parseFloat(itemValue) > parseFloat(value);
    case '>=': return parseFloat(itemValue) >= parseFloat(value);
    case '<': return parseFloat(itemValue) < parseFloat(value);
    case '<=': return parseFloat(itemValue) <= parseFloat(value);
    case 'isnull': return itemValue === null || itemValue === undefined || itemValue === '';
    case 'isnotnull': return itemValue !== null && itemValue !== undefined && itemValue !== '';
    default: return true;
  }
}

  showConfirm('确认反关闭选中的 ' + ids.length + ' 条单据？', function() {
    var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
    list.forEach(function(item) { if (ids.includes(item.id) && item.status === 'closed') item.status = 'approved'; });
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
    showToast('已反关闭 ' + ids.length + ' 条单据', 'success');
    loadData();
  });
}
function batchDelete() {
  var ids = getSelectedIds();
  if (ids.length === 0) { showToast('请选择要删除的单据', 'warning'); return; }
  showConfirm('确认删除选中的 ' + ids.length + ' 条单据？', function() {
    var list = JSON.parse(localStorage.getItem('erp_' + docType + '_list') || '[]');
    list = list.filter(function(item) { return !ids.includes(item.id); });
    localStorage.setItem('erp_' + docType + '_list', JSON.stringify(list));
    showToast('已删除 ' + ids.length + ' 条单据', 'success');
    loadData();
  });
}
function openColumnSettings() {
  var container = document.getElementById('columnCheckboxes');
  container.innerHTML = '';
  allColumns.forEach(function(col) {
    var item = document.createElement('div');
    item.className = 'column-item';
    var checked = visibleColumns.includes(col) ? 'checked' : '';
    item.innerHTML = '<input type="checkbox" ' + checked + ' value="' + col + '" onchange="toggleColumn(this)">' + '<label>' + col + '</label>';
    container.appendChild(item);
  });
  document.getElementById('columnModal').classList.add('show');
}
function closeColumnSettings() { document.getElementById('columnModal').classList.remove('show'); }
function toggleColumn(cb) {
  var idx = visibleColumns.indexOf(cb.value);
  if (cb.checked && idx === -1) visibleColumns.push(cb.value);
  else if (!cb.checked && idx !== -1) visibleColumns.splice(idx, 1);
}
function saveColumnSettings() {
  localStorage.setItem('visible_columns_' + docType, JSON.stringify(visibleColumns));
  showToast('列设置已保存', 'success');
  closeColumnSettings();
  loadData();
}
function prevPage() { if (currentPage > 1) { currentPage--; loadData(); } }
function nextPage() { loadData(); }
function exitPage() { showConfirm("确认退出？", function() { window.location.href = "../index.html"; }); }
document.addEventListener('DOMContentLoaded', init);
</script>
