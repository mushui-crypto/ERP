<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试数据初始化 - 磐枢工业智能平台</title>
<link rel="stylesheet" href="common.css">
<script src="common.js"></script>
<script src="init_test_data.js"></script>
<style>
.page-body { display: flex; justify-content: center; align-items: center; min-height: 60vh; }
.init-card { background: #fff; border-radius: 8px; padding: 40px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.init-card h2 { margin-bottom: 20px; color: #333; }
.init-card p { color: #666; margin-bottom: 30px; line-height: 1.6; }
.init-btn { padding: 12px 32px; background: #1890ff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
.init-btn:hover { background: #40a9ff; }
.success-msg { color: #52c41a; margin-top: 20px; font-weight: 500; }
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="images/logo.png" alt="磐枢工业智能平台" style="width: 100%; max-width: 200px; margin-bottom: 8px;">
    <h1 style="font-size: 16px; margin: 0;">磐枢HubPang</h1>
  </div>
  <nav class="sidebar-menu"></nav>
  <div class="sidebar-user"><div class="avatar">管理员</div></div>
</aside>
<div class="main-content" id="mainContent">
  <div class="page-header">
    <div>
      <div class="flex items-center gap-8">
        <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
        <div>
          <h2>测试数据初始化</h2>
          <div class="breadcrumb"><a href="index.html">首页</a> <span>/</span> <span>系统管理</span></div>
        </div>
      </div>
    </div>
    <div class="page-actions"></div>
  </div>

  <div class="page-body">
    <div class="init-card">
      <h2>初始化测试数据</h2>
      <p>点击下方按钮初始化完整的测试数据，包括：</p>
      <ul style="text-align: left; margin-left: 40px; margin-bottom: 30px; color: #666;">
        <li>物料：13种（笔记本电脑及BOM组件）</li>
        <li>供应商：5家</li>
        <li>客户：4家</li>
        <li>仓库：4个</li>
        <li>组织、部门、员工等基础资料</li>
        <li>BOM：笔记本电脑BOM</li>
        <li>销售报价单、销售订单</li>
        <li>采购申请单、采购订单</li>
        <li>生产订单</li>
      </ul>
      <button class="init-btn" onclick="initTestData()">开始初始化</button>
      <div class="success-msg" id="successMsg"></div>
    </div>
  </div>
</div>
<script>
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(function(m) {
      m.classList.remove('show');
    });
  }
});
</script>
</body>
</html>
